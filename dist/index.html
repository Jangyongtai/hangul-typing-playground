<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; media-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
</head>
<body>
<title>한글톡톡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: 섬 마을 게시판 — 모래빛 바탕 위에 둥근 크림색 카드, 잎사귀 초록과 햇살 노랑 포인트, 게임은 둥근 창 */
:root {
  --sand: #F2E2B8;
  --sand-dot: #E6D09B;
  --card: #FFFBEF;
  --card-base: #D5BA80;
  --ink: #5A3A1E;
  --ink-soft: #8C6A48;
  --leaf: #35B045;
  --leaf-dark: #23842F;
  --mint: #14B795;
  --mint-dark: #0B8A70;
  --sun: #FFC928;
  --sun-dark: #DB960B;
  --coral: #FF6B5E;
  --coral-dark: #CF4639;
  --sky: #3DB8F2;
  --sky-soft: #C4ECFF;
  --lilac: #9B7BF0;
  --ok: #23842F;
  --f-display: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-num: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --r-card: 26px;
  --lift: inset 0 2px 0 #FFFFFF, 0 8px 0 var(--card-base), 0 18px 30px rgba(90, 58, 30, 0.2);
  --shine: linear-gradient(180deg, #FFFFFF 0%, var(--card) 55%, #FBF1DA 100%);
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { background: var(--sand); color: var(--ink); }
body {
  margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  background-image:
    radial-gradient(circle at 25% 25%, var(--sand-dot) 0 7px, transparent 7.5px),
    radial-gradient(circle at 75% 75%, var(--sand-dot) 0 7px, transparent 7.5px);
  background-size: 56px 56px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
.wrap {
  max-width: 1020px; margin: 0 auto; padding-block: 14px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 위쪽 막대 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.logo {
  position: relative; border: 0; cursor: pointer; color: #fff;
  background: linear-gradient(180deg, #6FCB6A, var(--leaf));
  box-shadow: 0 5px 0 var(--leaf-dark), 0 10px 20px rgba(63, 145, 69, 0.25);
  border-radius: 999px; padding: 6px 22px 8px 48px;
  font-family: var(--f-display); font-size: 26px; letter-spacing: 0.5px; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
}
.logo::before {
  content: '톡'; position: absolute; left: 7px; top: 50%; transform: translateY(-55%);
  width: 34px; height: 34px; border-radius: 50%; background: var(--sun); color: var(--ink);
  display: grid; place-items: center; font-size: 18px; text-shadow: none; box-shadow: inset 0 -3px 0 var(--sun-dark);
}
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 버튼 */
.btn {
  border: 0; border-radius: 999px; cursor: pointer;
  background: var(--card); color: var(--ink);
  box-shadow: 0 4px 0 var(--card-base), 0 6px 14px rgba(107, 78, 53, 0.1);
  padding: 9px 20px; font-family: var(--f-display); font-size: 17px; transition: transform .08s, box-shadow .08s;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-base); }
.btn.small { padding: 6px 14px; font-size: 15px; }
.btn.primary { background: var(--mint); color: #fff; box-shadow: 0 4px 0 var(--mint-dark), 0 8px 16px rgba(39, 151, 132, 0.25); text-shadow: 0 1px 0 rgba(0, 0, 0, 0.12); }
.btn.primary:active { box-shadow: 0 1px 0 var(--mint-dark); }
.btn.danger { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-dark); }
.btn.big { font-size: 22px; padding: 12px 34px; }
.btn.toggle[aria-pressed="false"] { opacity: .55; }
.btn.who { background: var(--sun); box-shadow: 0 4px 0 var(--sun-dark); }

/* 공통 패널 */
.panel { background: var(--card); border-radius: var(--r-card); box-shadow: var(--lift); padding: 22px; }
h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; color: var(--ink); }
h2 { font-size: 28px; }
h2.sec {
  display: inline-block; font-size: 20px; margin: 26px 0 12px; padding: 4px 18px 5px; border-radius: 999px;
  background: var(--sun); box-shadow: 0 3px 0 var(--sun-dark);
}
.lbl { margin: 14px 0 6px; font-family: var(--f-display); font-size: 16px; color: var(--ink-soft); }
.note { color: var(--ink-soft); font-size: 14px; text-align: center; margin: 12px 0 0; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.bar h2 { flex: 1; min-width: 0; font-size: 25px; }

/* 처음 화면 */
.hero { display: flex; align-items: center; gap: 16px; }
.mascot {
  font-size: 62px; line-height: 1; flex: none; width: 104px; height: 104px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFF6CF, var(--sun) 70%);
  box-shadow: 0 6px 0 var(--sun-dark), 0 14px 26px rgba(233, 179, 63, 0.35);
  display: grid; place-items: center; animation: bob 2.6s ease-in-out infinite;
}
.bubble {
  position: relative; background: var(--card); border-radius: 30px; box-shadow: var(--lift);
  padding: 14px 22px; margin: 0; font-family: var(--f-display); font-size: 20px; min-width: 0;
}
.bubble::before {
  content: ''; position: absolute; left: -10px; top: 50%; width: 22px; height: 22px; background: var(--card);
  transform: translateY(-50%) rotate(45deg); border-radius: 4px;
}
.statbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 18px; }
.stat { background: var(--card); border-radius: 20px; padding: 10px 14px; text-align: center; box-shadow: 0 4px 0 var(--card-base); }
.stat small { display: block; color: var(--ink-soft); font-size: 13px; }
.stat b { font-family: var(--f-num); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.mode-card {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  background: var(--card); border: 0; border-radius: var(--r-card); box-shadow: var(--lift); padding: 16px 18px 18px; cursor: pointer;
  transition: transform .12s ease;
}
.mode-card:hover { transform: translateY(-3px) rotate(-0.4deg); }
.mode-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--card-base); }
.glyph {
  font-family: var(--f-display); font-size: 32px; line-height: 1; color: var(--ink);
  min-width: 58px; height: 58px; border-radius: 18px; padding: 0 10px; margin-bottom: 10px;
  display: grid; place-items: center; background: var(--sky-soft); box-shadow: inset 0 -4px 0 rgba(107, 78, 53, 0.08);
}
.glyph.small { font-size: 20px; letter-spacing: 1px; }
.cards > .mode-card:nth-child(4n+1) .glyph { background: #DDF2FB; }
.cards > .mode-card:nth-child(4n+2) .glyph { background: #E3F5DA; }
.cards > .mode-card:nth-child(4n+3) .glyph { background: #FFF0C7; }
.cards > .mode-card:nth-child(4n+4) .glyph { background: #FDE2DD; }
.mc-t { font-family: var(--f-display); font-size: 21px; }
.mc-d { color: var(--ink-soft); font-size: 14px; }
.mc-best { position: absolute; top: 14px; right: 16px; font-family: var(--f-num); font-weight: 800; font-size: 15px; background: var(--sand); padding: 1px 10px; border-radius: 999px; }
.st-no { font-family: var(--f-num); font-weight: 800; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; letter-spacing: .5px; }
.more { color: var(--ink-soft); font-size: 14px; margin: 10px 0 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.badge { background: rgba(255, 252, 242, 0.55); border: 2px dashed var(--card-base); border-radius: 20px; padding: 10px 6px; text-align: center; color: var(--ink-soft); }
.badge span { display: block; font-size: 28px; filter: grayscale(1); opacity: .5; }
.badge small { font-size: 12px; }
.badge.on { background: var(--card); border: 0; box-shadow: 0 4px 0 var(--card-base); color: var(--ink); }
.badge.on span { filter: none; opacity: 1; }
.stars .st { color: #E5DCC4; font-size: 19px; }
.stars .st.on { color: var(--sun-dark); }

/* 사용자 고르기 */
.profiles h2 { margin-bottom: 16px; }
.profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.profile-card { position: relative; }
.pf-use {
  width: 100%; border: 0; border-radius: var(--r-card); background: var(--sky-soft); box-shadow: 0 5px 0 #B9DDEB;
  padding: 16px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.pf-use:active { transform: translateY(3px); box-shadow: 0 2px 0 #B9DDEB; }
.pf-av { font-size: 50px; line-height: 1.1; }
.pf-name { font-family: var(--f-display); font-size: 21px; overflow-wrap: anywhere; }
.pf-del { position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 3px 0 var(--card-base); cursor: pointer; font-size: 13px; color: var(--ink-soft); }
.pf-confirm { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.pf-confirm small { color: var(--coral-dark); }
.new-profile { margin-top: 24px; border-top: 2px dashed var(--card-base); padding-top: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.new-profile label { font-family: var(--f-display); }
.new-profile input {
  font: inherit; font-size: 20px; border: 0; border-radius: 16px; padding: 10px 16px; width: min(320px, 100%);
  background: var(--sand); color: var(--ink); box-shadow: inset 0 3px 0 var(--sand-dot);
}
.avatar-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.av-b { font-size: 30px; width: 58px; height: 58px; border: 0; border-radius: 50%; background: var(--sand); cursor: pointer; transition: transform .1s; }
.av-b[aria-pressed="true"] { background: var(--sun); box-shadow: 0 4px 0 var(--sun-dark); transform: translateY(-3px) scale(1.05); }
.form-err { color: var(--coral-dark); margin: 0; }

/* 연습 화면 */
.meters { display: flex; gap: 8px; flex-wrap: wrap; }
.meter { background: var(--card); border-radius: 18px; padding: 3px 14px 4px; text-align: center; min-width: 78px; box-shadow: 0 3px 0 var(--card-base); }
.meter small { display: block; font-size: 11px; color: var(--ink-soft); }
.meter b { font-family: var(--f-num); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.progress { height: 14px; background: var(--card); border-radius: 999px; overflow: hidden; margin-bottom: 14px; box-shadow: inset 0 2px 0 var(--sand-dot); }
.progress div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8ED97C, var(--leaf)); transition: width .35s ease; }
.target-card, .story-card {
  position: relative; background: var(--card); border-radius: 30px; box-shadow: var(--lift);
  padding: 22px 18px 18px; text-align: center; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.target-card.shake { animation: shake .28s; }
.target-card.win { background: #F1FBEA; }
.emoji { font-size: 60px; line-height: 1.1; filter: drop-shadow(0 4px 4px rgba(107, 78, 53, 0.15)); }
.big-jamo { font-family: var(--f-display); font-size: clamp(76px, 16vw, 124px); line-height: 1; }
.target { font-family: var(--f-display); font-size: clamp(38px, 8vw, 66px); line-height: 1.25; overflow-wrap: anywhere; }
.pv-sent .target, .story-card .target { font-size: clamp(24px, 5vw, 40px); }
.ch { color: #CDBFA3; transition: color .1s; }
.ch.done { color: var(--ok); }
.ch.cur { color: var(--ink); background: #FFF0B3; border-radius: 10px; box-shadow: inset 0 -5px 0 var(--sun); }
.ch.punct.cur { background: none; box-shadow: none; }
.ch.sp { padding: 0 .15em; }
.sub { color: var(--ink-soft); font-size: 17px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.sub .rom { font-style: italic; }
.sub .en { color: var(--ink); font-weight: 700; }
.tag { font-size: 13px; background: var(--sun); border-radius: 999px; padding: 1px 10px; }
.say { position: absolute; top: 14px; right: 14px; font-size: 22px; border: 0; border-radius: 50%; background: var(--sky-soft); box-shadow: 0 3px 0 #B9DDEB; cursor: pointer; width: 48px; height: 48px; }
.say:active { transform: translateY(2px); box-shadow: 0 1px 0 #B9DDEB; }
.praise { position: absolute; top: 14px; left: 14px; font-family: var(--f-display); font-size: 20px; color: #fff; background: var(--coral); border-radius: 999px; padding: 3px 14px; box-shadow: 0 3px 0 var(--coral-dark); animation: popin .35s cubic-bezier(.3, 1.6, .5, 1); }
.sv-prev, .sv-next { margin: 0; color: #CDBFA3; font-family: var(--f-display); font-size: 17px; }
.typed {
  margin-top: 14px; min-height: 56px; background: var(--card); border-radius: 22px; padding: 8px 18px;
  font-family: var(--f-display); font-size: 28px; display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere; text-align: center;
  box-shadow: inset 0 3px 0 var(--sand-dot), 0 3px 0 var(--card-base);
}
.typed .comp { text-decoration: underline 4px var(--mint); text-underline-offset: 7px; }
.typed .ph { color: #CDBFA3; font-size: 16px; font-family: var(--f-body); }
.typed.bad { animation: shake .28s; background: #FDEBE8; }
.hintline { text-align: center; margin: 10px 0; font-size: 16px; min-height: 28px; color: var(--ink-soft); }
.hintline kbd { font-family: var(--f-display); font-size: 21px; color: var(--ink); background: var(--sun); border-radius: 10px; padding: 0 10px; box-shadow: 0 3px 0 var(--sun-dark); }
.hintline .letter { font-family: var(--f-num); font-weight: 800; font-size: 13px; }
.tipbox { background: #FFF6D6; border-radius: 20px; padding: 10px 16px; margin: 10px 0; font-size: 15px; box-shadow: 0 3px 0 #F1E2AC; }
.tipbox b { color: var(--sun-dark); }
.tip-ko { color: var(--ink-soft); }

/* 화면 자판 */
.kb { display: flex; flex-direction: column; gap: 7px; max-width: 780px; margin: 10px auto 0; user-select: none; padding: 12px; background: rgba(230, 218, 187, 0.45); border-radius: 26px; }
.kb-row { display: flex; gap: 6px; justify-content: center; }
.kb-row.r1 { padding-left: 3%; }
.key {
  position: relative; flex: 1 1 0; max-width: 64px; min-width: 0; height: 54px; border: 0; border-radius: 14px;
  background: var(--card); box-shadow: 0 4px 0 var(--card-base); cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center; transition: transform .06s;
}
.key b { font-family: var(--f-display); font-weight: 400; font-size: 23px; color: var(--ink); }
.key i { position: absolute; top: 4px; left: 7px; font-style: normal; font-family: var(--f-num); font-weight: 800; font-size: 10px; color: #C4B393; }
.key::before { content: ''; position: absolute; bottom: 6px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: transparent; }
.key.f0::before, .key.f7::before { background: var(--coral); }
.key.f1::before, .key.f6::before { background: var(--sun-dark); }
.key.f2::before, .key.f5::before { background: var(--leaf); }
.key.f3::before, .key.f4::before { background: var(--sky); }
.key.bump::after { content: ''; position: absolute; bottom: 17px; width: 14px; height: 3px; border-radius: 2px; background: #C4B393; }
.key.wide { flex: 1.5 1 0; max-width: 96px; font-size: 20px; background: #F1E9D3; }
.key.space { flex: 0 1 400px; max-width: 400px; font-family: var(--f-display); font-size: 16px; color: var(--ink-soft); }
.key.on { background: var(--mint); color: #fff; box-shadow: 0 4px 0 var(--mint-dark); }
.key.hint { background: var(--sun); box-shadow: 0 4px 0 var(--sun-dark), 0 0 0 4px rgba(255, 217, 100, 0.45); animation: nudge .8s ease-in-out infinite; }
.key.press { animation: press .14s; }

/* 게임 화면 */
.hud { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hud-i { background: var(--card); border-radius: 16px; padding: 2px 12px 3px; text-align: center; min-width: 64px; box-shadow: 0 3px 0 var(--card-base); }
.hud-i small { display: block; font-size: 11px; color: var(--ink-soft); }
.hud-i b { font-family: var(--f-num); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.hearts { color: var(--coral); font-size: 21px; letter-spacing: 1px; }
.hearts .lost { color: #E5DCC4; }
.screen { position: relative; border-radius: 30px; overflow: hidden; box-shadow: 0 6px 0 var(--card-base), 0 16px 34px rgba(107, 78, 53, 0.18); background: var(--sky-soft); border: 6px solid var(--card); }
.screen canvas { display: block; width: 100%; }
.overlay { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: rgba(107, 78, 53, 0.28); backdrop-filter: blur(2px); padding: 12px; overflow-y: auto; }
.ov-box { background: var(--card); border-radius: 30px; box-shadow: var(--lift); padding: 20px 22px; width: min(540px, 100%); text-align: center; max-height: 100%; overflow-y: auto; }
.ov-box h3 { font-size: 30px; }
.ov-box p { margin: 6px 0; }
.ov-box .statbar { margin-top: 10px; }
.seg { display: inline-flex; background: var(--sand); border-radius: 999px; padding: 4px; gap: 4px; flex-wrap: wrap; justify-content: center; }
.seg-b { border: 0; border-radius: 999px; background: transparent; padding: 6px 16px; font-family: var(--f-display); font-size: 17px; cursor: pointer; color: var(--ink-soft); }
.seg-b[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--card-base); }
.best { font-family: var(--f-display); }
.newbest { font-family: var(--f-display); font-size: 22px; color: var(--coral-dark); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { border: 0; border-radius: 999px; background: var(--sky-soft); padding: 4px 12px; cursor: pointer; font-family: var(--f-display); font-size: 16px; box-shadow: 0 2px 0 #B9DDEB; }
.chip small { font-family: var(--f-body); color: var(--ink-soft); }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.gin { display: flex; gap: 8px; align-items: stretch; margin-top: 12px; }
.gin .typed { flex: 1; margin: 0; min-width: 0; }
.debug-hud { position: absolute; left: 10px; bottom: 10px; z-index: 3; background: rgba(0, 0, 0, .65); color: #8f8; font: 11px/1.3 monospace; padding: 3px 8px; border-radius: 8px; }
.story-opts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px 18px; }
.story-opts .lbl { margin: 0; }
.extra { font-family: var(--f-display); font-size: 18px; margin: 4px 0; }

/* 레이스 */
.race-target { margin-top: 12px; background: var(--card); border-radius: 26px; box-shadow: var(--lift); padding: 12px 18px; text-align: center; min-height: 64px; }
.race-target:empty { display: none; }
.rt-main { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.rt-emoji { font-size: 38px; }
.race-target .target { font-size: clamp(30px, 6vw, 50px); }
.rt-en { color: var(--ink-soft); font-weight: 700; }
.rt-next { color: #CDBFA3; font-size: 15px; }
.place { font-family: var(--f-display); font-size: 32px; }
.podium { list-style: none; padding: 0; margin: 8px auto; max-width: 320px; text-align: left; counter-reset: pl; }
.podium li { counter-increment: pl; display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px; border-radius: 14px; font-family: var(--f-display); }
.podium li + li { margin-top: 4px; }
.podium li::before { content: counter(pl); font-family: var(--f-num); font-weight: 800; align-self: center; width: 22px; color: var(--ink-soft); }
.podium li span { flex: 1; }
.podium li.me { background: #FFF0B3; }

/* 결과 */
.result { text-align: center; }
.big-stars .st { font-size: 60px; }
.big-stars .st.on { display: inline-block; animation: popin .5s cubic-bezier(.3, 1.6, .5, 1) backwards; }

<script>
// ==== config.js ====
// 조정값은 모두 여기에 모아 둡니다. 숫자만 바꾸면 게임 난이도가 바뀝니다.
// 화면 주소 끝에 #debug 를 붙이면(또는 로고를 5번 누르면) 디버그 패널에서 실시간으로 바꿔 볼 수 있습니다.
var HT = globalThis.HT = globalThis.HT || {};

HT.DEFAULT_CONFIG = {
  practice: {
    keysPerStage: 15,        // 자리 익히기 한 단계 문제 수
    reviewRatio: 0.3,        // 이전 단계 복습 비율
    wordsPerRound: 8,        // 낱말 연습 한 판 낱말 수
    reviewInRound: 2,        // 낱말 연습에 섞어 넣을 틀렸던 낱말 수
    sentencesPerRound: 5,    // 짧은 글 한 판 문장 수
    tipEvery: 4,             // 몇 문제마다 공부 팁을 보여줄지
    nextDelayMs: { keys: 250, words: 750, sent: 950 },
    stars: { three: 95, two: 80 } // 정확도(%) 기준 별 개수
  },
  story: {
    minuteChoices: [1, 3, 5], // 동화 긴 글 시간 선택지(분)
    defaultMinutes: 5        // 기본 5분 검정
  },
  score: { perKey: 10, comboStep: 0.1, comboMaxMul: 3 },
  rain: {
    lives: 5,
    fallSeconds: { slow: 14, normal: 10, fast: 7 },   // 화면 위에서 바닥까지 걸리는 시간(1레벨)
    spawnSeconds: { slow: 3.0, normal: 2.3, fast: 1.7 },
    minSpawnSeconds: 0.9,
    levelEvery: 10,          // 몇 개 맞히면 레벨업
    speedUpPerLevel: 0.07,   // 레벨마다 빨라지는 비율
    maxSpeedMul: 1.9,        // 아무리 레벨이 올라도 이 배수 이상 빨라지지 않음
    onScreen: { base: 3, perLevel: 1, max: 7 },
    goldChance: 0.08,        // 황금 단어: 잡으면 잠시 느려짐
    slowFactor: 0.45,
    slowSeconds: 5
  },
  balloon: {
    lives: 5,
    riseSeconds: { slow: 12, normal: 9, fast: 6.5 },
    spawnSeconds: { slow: 3.0, normal: 2.3, fast: 1.7 },
    minSpawnSeconds: 0.9,
    levelEvery: 10,
    speedUpPerLevel: 0.07,
    maxSpeedMul: 1.9,
    onScreen: { base: 3, perLevel: 1, max: 7 },
    goldChance: 0.08,        // 황금 풍선: 잡으면 하트 +1
    maxLives: 5
  },
  race: {
    cpuCount: 3,
    defaultPlayerKpm: 35,    // 기록이 없을 때 가정하는 아이 타수(타/분)
    avgOfLastRaces: 5,       // 최근 몇 판 평균으로 실력을 잡을지
    cpuRatios: {             // 내 평균 타수 대비 컴퓨터 선수 속도
      easy: [0.6, 0.75, 0.9],
      normal: [0.8, 0.95, 1.1],
      hard: [0.95, 1.1, 1.25]
    },
    cpuKpmMin: 15,
    cpuKpmMax: 400,
    cpuJitter: 0.15,         // 컴퓨터 속도 흔들림(±비율)
    stumblePerSecond: 0.03,  // 컴퓨터가 넘어질 확률(초당)
    stumbleSeconds: 0.9,
    raceKeys: { short: 40, normal: 70, long: 110 }, // 경주 길이(타 수)
    minAccuracyToCount: 60   // 이 정확도 미만 판은 실력 평균에 넣지 않음
  }
};

HT.CONFIG_KEY = 'hangul-typing-config-override';

// 디버그 패널에서 저장한 값이 있으면 기본값 위에 덮어씁니다.
HT.loadConfig = function () {
  var base = JSON.parse(JSON.stringify(HT.DEFAULT_CONFIG));
  try {
    var raw = globalThis.localStorage && localStorage.getItem(HT.CONFIG_KEY);
    if (raw) HT.deepMerge(base, JSON.parse(raw));
  } catch (e) { /* 저장소를 못 쓰면 기본값 사용 */ }
  HT.CONFIG = base;
  return base;
};

HT.deepMerge = function (target, src) {
  if (!src || typeof src !== 'object') return target;
  Object.keys(src).forEach(function (k) {
    // 저장된 값을 조작해 객체 기본 동작을 바꾸는 공격(prototype pollution) 차단
    if (k === '__proto__' || k === 'constructor' || k === 'prototype') return;
    if (!Object.prototype.hasOwnProperty.call(target, k)) return;
    var v = src[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
      HT.deepMerge(target[k], v);
    } else if (typeof v === typeof target[k] || target[k] === null) {
      target[k] = v; // 숫자 자리에 글자처럼 다른 종류 값은 무시
    }
  });
  return target;

  var VCOMB = { 'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ', 'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ', 'ㅡㅣ': 'ㅢ' };
  var CCOMB = { 'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ' };
  var SPLIT = {};
  [VCOMB, CCOMB].forEach(function (m) {
    Object.keys(m).forEach(function (k) { SPLIT[m[k]] = [k[0], k[1]]; });
  });

  function isVowel(j) { return JUNG.indexOf(j) >= 0; }
  function isCons(j) { return CHO.indexOf(j) >= 0 || !!SPLIT[j] && !isVowel(j); }

  function composeBlock(c) {
    if (c.c && c.v) {
      return String.fromCharCode(0xAC00 + (CHO.indexOf(c.c) * 21 + JUNG.indexOf(c.v)) * 28 + JONG.indexOf(c.f));
    }
    return c.c || c.v || '';
  }

  function Hangul() { this.reset(); }
  Hangul.prototype.reset = function () { this.text = ''; this.comp = { c: '', v: '', f: '' }; };
  Hangul.prototype.compChar = function () { return composeBlock(this.comp); };
  Object.defineProperty(Hangul.prototype, 'value', { get: function () { return this.text + composeBlock(this.comp); } });
  Hangul.prototype.commit = function () { this.text += composeBlock(this.comp); this.comp = { c: '', v: '', f: '' }; };
  Hangul.prototype.snapshot = function () { return { text: this.text, comp: { c: this.comp.c, v: this.comp.v, f: this.comp.f } }; };
  Hangul.prototype.restore = function (s) { this.text = s.text; this.comp = { c: s.comp.c, v: s.comp.v, f: s.comp.f }; };

  Hangul.prototype.input = function (j) {
    var c = this.comp;
    if (isVowel(j)) {
      if (c.f) {
        // 받침이 다음 글자 첫소리로 넘어감: 각 + ㅏ → 가가
        var parts = SPLIT[c.f];
        var moved;
        if (parts) { c.f = parts[0]; moved = parts[1]; } else { moved = c.f; c.f = ''; }
        this.commit();
        this.comp = { c: moved, v: j, f: '' };
      } else if (c.v) {
        var m = VCOMB[c.v + j];
        if (m) c.v = m; else { this.commit(); this.comp = { c: '', v: j, f: '' }; }
      } else if (c.c) {
        c.v = j;
      } else {
        this.comp = { c: '', v: j, f: '' };
      }
    } else if (isCons(j)) {
      if (c.f) {
        var cf = CCOMB[c.f + j];
        if (cf) c.f = cf; else { this.commit(); this.comp = { c: j, v: '', f: '' }; }

        else { this.commit(); this.comp = { c: j, v: '', f: '' }; }
      } else if (c.c) {
        this.commit(); this.comp = { c: j, v: '', f: '' };
      } else {
        c.c = j;
      }
    } else {
      this.char(j);
    }
  };

  Hangul.prototype.space = function () { this.commit(); this.text += ' '; };
  Hangul.prototype.char = function (ch) { this.commit(); this.text += ch; };

  Hangul.prototype.backspace = function () {
    var c = this.comp, p;
    if (c.f) { p = SPLIT[c.f]; c.f = p ? p[0] : ''; }
    else if (c.v) { p = SPLIT[c.v]; c.v = p ? p[0] : ''; }

  };

  function keysOf(str) {
    var out = [];

      var ch = str[i], code = ch.charCodeAt(0);

        push(JUNG[Math.floor((n % 588) / 28)]);
        var jong = n % 28;
        if (jong) push(JONG[jong]);
      } else {
        push(ch);
      }
    }
    return out;
  }

  function isPrefix(a, b) {
    if (a.length > b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  HT.Hangul = Hangul;
  HT.keysOf = keysOf;
  HT.isPrefix = isPrefix;
  HT.isVowel = isVowel;
  HT.composeBlock = composeBlock;
})();

var HT = globalThis.HT = globalThis.HT || {};

HT.Sfx = {
  ctx: null,
  on: true,
  ensure: function () {
    try {
      if (!this.ctx) {
        var AC = globalThis.AudioContext || globalThis.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  tone: function (freq, dur, o) {
    o = o || {};
    if (!this.on) return;
    var c = this.ensure(); if (!c) return;
    var t = c.currentTime + (o.delay || 0);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + o.slide), t + dur);
    g.gain.setValueAtTime(o.vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  noise: function (dur, vol, delay) {
    if (!this.on) return;
    var c = this.ensure(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    var len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1800;
    src.buffer = buf; g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  },
  tick: function () { this.tone(1250, 0.025, { vol: 0.025 }); },
  click: function () { this.tone(520, 0.05, { type: 'triangle', vol: 0.08 }); },
  ok: function () { this.tone(660, 0.07); this.tone(990, 0.12, { delay: 0.07 }); },
  wrong: function () { this.tone(140, 0.16, { type: 'sawtooth', vol: 0.05 }); },
  pop: function () { this.noise(0.12, 0.14); this.tone(700, 0.09, { slide: 700, vol: 0.05 }); },
  miss: function () { this.tone(330, 0.3, { type: 'triangle', slide: -220, vol: 0.12 }); },

var HT = globalThis.HT = globalThis.HT || {};

HT.Store = {
  KEY: 'hangul-typing-v1',
  db: null,

  blankProfileData: function () {
    return {
      stars: {}, best: { rain: 0, balloon: 0 }, wordsTyped: 0, keysTyped: 0, bestSpeed: 0,
      streak: 0, maxStreak: 0, lastDay: '', missed: {}, badges: [], maxCombo: 0, maxPop: 0,
      raceKpms: [], raceWins: 0, gameCfg: {}, storyBest: {}
    };
  },

  load: function () {
    var db = null;
    try { db = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { db = null; }
    if (!db || typeof db !== 'object') db = {};
    db.settings = db.settings || {};
    // 저장된 내용은 믿지 않고 모양을 확인한 뒤 씁니다
    db.settings = typeof db.settings === 'object' && db.settings ? db.settings : {};
    db.profiles = (Array.isArray(db.profiles) ? db.profiles : []).filter(function (p) {
      return p && typeof p.id === 'string' && /^p[a-z0-9]{1,24}$/.test(p.id) && typeof p.name === 'string';
    }).map(function (p) {
      return { id: p.id, name: HT.cleanName(p.name) || '?', avatar: HT.AVATARS.indexOf(p.avatar) >= 0 ? p.avatar : HT.AVATARS[0], created: +p.created || 0 };
    });
    db.data = typeof db.data === 'object' && db.data ? db.data : {};
    var self = this;
    db.profiles.forEach(function (p) {
      db.data[p.id] = HT.deepMerge(self.blankProfileData(), db.data[p.id] || {});
      // deepMerge는 기본값에 없는 키를 버리므로 가변 키 객체는 따로 복사
      ['stars', 'missed', 'gameCfg', 'storyBest'].forEach(function (k) {
        var saved = (db.data[p.id] && db.data[p.id][k]);
        if (saved && typeof saved === 'object') db.data[p.id][k] = saved;
      });
    });
    if (db.current && !db.data[db.current]) db.current = null;
    this.db = db;
    return db;
  },

  save: function () {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.db)); } catch (e) { /* 저장 불가 환경 */ }
  },

  settings: function () { return this.db.settings; },
  profile: function () {
    var id = this.db.current;
    return this.db.profiles.filter(function (p) { return p.id === id; })[0] || null;
  },
  data: function () { return this.db.data[this.db.current] || this.blankProfileData(); },

  addProfile: function (name, avatar) {
    var id = 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
    name = HT.cleanName(name);
    if (HT.AVATARS.indexOf(avatar) < 0) avatar = HT.AVATARS[0];
    this.db.profiles.push({ id: id, name: name, avatar: avatar, created: Date.now() });
    this.db.data[id] = this.blankProfileData();
    this.db.current = id;
    this.save();
    return id;
  },
  removeProfile: function (id) {
    this.db.profiles = this.db.profiles.filter(function (p) { return p.id !== id; });
    delete this.db.data[id];
    if (this.db.current === id) this.db.current = null;
    this.save();
  },
  use: function (id) { this.db.current = id; this.save(); },

// ---- 문제 만들기 ----
HT.noRepeatNeighbors = function (list) {
  for (var i = 1; i < list.length; i++) {
    if (list[i].text === list[i - 1].text) {
      for (var j = i + 1; j < list.length; j++) {
        if (list[j].text !== list[i - 1].text) { var t = list[i]; list[i] = list[j]; list[j] = t; break; }
      }
    }
  }
  return list;
};

HT.startKeysStage = function (idx) {
  var C = HT.CONFIG.practice, st = HT.STAGES[idx], items;
  if (!st.jamo) {
    items = HT.shuffle(st.syl === 'batchim' ? HT.SYLLABLES_B : HT.SYLLABLES).slice(0, 12).map(function (s) { return { text: s }; });
  } else {
    var pool = st.jamo.split(''), prev = HT.STAGES.slice(0, idx).map(function (s) { return s.jamo; }).join('').split('').filter(Boolean);
    var nReview = prev.length ? Math.round(C.keysPerStage * C.reviewRatio) : 0, list = [];
    while (list.length < C.keysPerStage - nReview) list = list.concat(HT.shuffle(pool));
    list = list.slice(0, C.keysPerStage - nReview);
    for (var i = 0; i < nReview; i++) list.push(HT.pick(prev));
    items = HT.noRepeatNeighbors(HT.shuffle(list).map(function (j) { return { text: j, jamo: true }; }));
  }
  HT.go('practice', {
    kind: 'keys', title: HT.L(st.ko, st.en), starKey: 'keys-' + st.id, items: items, tip: HT.TIPS[st.tip],
    again: function () { HT.startKeysStage(idx); },
    next: idx + 1 < HT.STAGES.length ? function () { HT.startKeysStage(idx + 1); } : null,
    menu: 'keysMenu'
  });
};

HT.startWords = function (themeId) {
  var C = HT.CONFIG.practice, d = HT.Store.data(), items;
  var missed = Object.keys(d.missed).filter(function (w) { return HT.WORD_INDEX[w]; })
    .sort(function (a, b) { return d.missed[b] - d.missed[a]; });
  var title;
  if (themeId === 'review') {
    items = missed.slice(0, C.wordsPerRound).map(function (w) { return HT.WORD_INDEX[w]; });
    title = HT.t('review');
  } else {
    var th = HT.THEMES.filter(function (x) { return x.id === themeId; })[0];
    title = HT.L(th.ko, th.en);
    items = HT.shuffle(HT.ALL_WORDS.filter(function (w) { return w.theme === themeId; })).slice(0, C.wordsPerRound);
    var extra = missed.filter(function (w) { return HT.WORD_INDEX[w].theme !== themeId; }).slice(0, C.reviewInRound);
    extra.forEach(function (w, i) { var at = items.length - 1 - i; if (at >= 0) items[at] = Object.assign({ review: true }, HT.WORD_INDEX[w]); });
    items = HT.shuffle(items);
  }
  HT.go('practice', {
    kind: 'words', title: title, starKey: themeId === 'review' ? null : 'words-' + themeId, items: items,
    again: function () { HT.startWords(themeId); }, next: null, menu: 'wordsMenu'
  });
};

HT.startSentences = function () {
  HT.go('practice', {
    kind: 'sent', title: HT.t('sent'), starKey: 'sent', items: HT.shuffle(HT.SENTENCES).slice(0, HT.CONFIG.practice.sentencesPerRound),
    again: HT.startSentences, next: null, menu: 'home'
  });
};

// ---- 연습 화면 (자리/낱말/문장 공통) ----
// 틀린 키는 받아들이지 않고 소리만 냅니다. 그래서 칸에는 늘 맞게 친 글자만 남습니다.
HT.Views.practice = function (cfg) {
  var view = HT.$('#view'), C = HT.CONFIG.practice, ime = new HT.Hangul();
  var idx = 0, correct = 0, errors = 0, t0 = 0, busy = false, itemErr = false, timer = null;
  var items = cfg.items.map(function (it) { return Object.assign({ keys: HT.keysOf(it.text) }, it); });

  view.innerHTML = '<section class="pv pv-' + cfg.kind + '">' +
    '<div class="bar"><button type="button" class="btn small" data-back>← ' + HT.esc(HT.t('back')) + '</button><h2>' + HT.esc(cfg.title) + '</h2>' +
    '<div class="meters"><span class="meter"><small>' + HT.esc(HT.t('speed')) + '</small><b id="pv-speed">0</b></span>' +
    '<span class="meter"><small>' + HT.esc(HT.t('acc')) + '</small><b id="pv-acc">100%</b></span></div></div>' +
    '<div class="progress" aria-hidden="true"><div id="pv-prog"></div></div>' +
    '<div class="card target-card" id="pv-card"></div>' +
    '<div class="typed" id="pv-typed"></div>' +
    '<p class="hintline" id="pv-hint">&nbsp;</p>' +
    '<p class="tipbox" id="pv-tip"' + (cfg.tip ? '' : ' hidden') + '>' + (cfg.tip ? HT.tipHTML(cfg.tip) : '') + '</p>' +
    '<div id="pv-kb"></div>' +
    '<p class="note">' + HT.esc(HT.t('pressKey')) + ' · ' + HT.esc(HT.t('practiceNote')) + '</p></section>';
  var kb = HT.Keyboard(HT.$('#pv-kb'), onKey), card = HT.$('#pv-card');

  function sayItem(it) {
    if (it.jamo) HT.Speech.say(HT.JINFO[it.text][0]);
    else HT.Speech.say(it.text);
  }
  function showItem() {
    ime.reset(); itemErr = false;
    var it = items[idx], html = '';
    if (it.jamo) {
      var inf = HT.JINFO[it.text];
      html = '<div class="big-jamo">' + it.text + '</div><div class="sub">' + HT.esc(inf[0]) + ' · [' + HT.esc(inf[1]) + ']</div>';
    } else {
      if (it.emoji) html += '<div class="emoji" aria-hidden="true">' + it.emoji + '</div>';
      html += '<div class="target" id="pv-target"></div>';
      if (it.rom || it.en) html += '<div class="sub">' + (it.rom ? '<span class="rom">' + HT.esc(it.rom) + '</span>' : '') + (it.en ? '<span class="en">' + HT.esc(it.en) + '</span>' : '') + '</div>';
      if (it.review) html += '<span class="tag">🔁 ' + HT.esc(HT.t('review')) + '</span>';
    }
    html += '<button type="button" class="say" data-say aria-label="listen">🔊</button><div class="praise" id="pv-praise" hidden></div>';
    card.innerHTML = html;
    card.classList.remove('win');
    sayItem(it);
    renderState();
  }
  function renderState() {
    var it = items[idx];
    var tEl = HT.$('#pv-target');
    if (tEl) {
      var done = ime.text.length, full = HT.keysOf(ime.value).length === it.keys.length;
      tEl.innerHTML = it.text.split('').map(function (ch, i) {
        var cls = full || i < done ? 'done' : i === done ? 'cur' : '';
        return '<span class="ch ' + cls + (ch === ' ' ? ' sp' : '') + '">' + (ch === ' ' ? '·' : HT.esc(ch)) + '</span>';
      }).join('');
    }
    var comp = ime.compChar();
    HT.$('#pv-typed').innerHTML = ime.value ? HT.esc(ime.text).replace(/ /g, '&nbsp;') + (comp ? '<span class="comp">' + HT.esc(comp) + '</span>' : '') :
      '<span class="ph">' + HT.esc(HT.t('typeHere')) + '</span>';
    HT.showNextKey(kb, HT.$('#pv-hint'), busy ? null : it.keys[HT.keysOf(ime.value).length]);
    HT.$('#pv-prog').style.width = (idx / items.length * 100) + '%';
    var mins = t0 ? (performance.now() - t0) / 60000 : 0;
    HT.$('#pv-speed').textContent = mins > 0.02 ? Math.round(correct / mins) : 0;
    HT.$('#pv-acc').textContent = (correct + errors ? Math.round(correct / (correct + errors) * 100) : 100) + '%';
  }
  function onKey(k) {
    if (busy || k.type === 'esc' || k.type === 'enter') return;
    var it = items[idx];
    if (!t0) t0 = performance.now();
    if (k.type === 'bs') { ime.backspace(); HT.Sfx.tick(); renderState(); return; }
    var snap = ime.snapshot();
    if (k.type === 'jamo') ime.input(k.j);
    else if (k.type === 'space') ime.space();
    else if (k.type === 'char') ime.char(k.ch);
    var tk = HT.keysOf(ime.value);
    if (!HT.isPrefix(tk, it.keys)) {
      ime.restore(snap); errors++; itemErr = true; HT.Sfx.wrong();
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      renderState(); return;
    }
    correct++; HT.Sfx.tick();
    if (tk.length === it.keys.length) complete();
    renderState();
  }
  function complete() {
    busy = true;
    var it = items[idx];
    HT.Sfx.ok();
    card.classList.add('win');
    var pr = HT.$('#pv-praise'); var p = HT.pick(HT.PRAISE); pr.textContent = HT.L(p[0], p[1]); pr.hidden = false;
    var d = HT.Store.data();
    d.keysTyped += it.keys.length;
    if (cfg.kind === 'words') { d.wordsTyped += 1; HT.Store.markMiss(it.text, itemErr); }
    if (cfg.kind === 'sent') d.wordsTyped += it.text.split(' ').length;
    var n = idx + 1;
    if (cfg.kind !== 'keys' && n % C.tipEvery === 0 && n < items.length) {
      var tb = HT.$('#pv-tip'); tb.innerHTML = HT.tipHTML(HT.randomTip()); tb.hidden = false;
    }
    timer = setTimeout(function () {
      busy = false; idx++;
      if (idx >= items.length) finish(); else showItem();
    }, C.nextDelayMs[cfg.kind]);
  }
  function finish() {
    var secs = (performance.now() - t0) / 1000, speed = Math.round(correct / Math.max(secs / 60, 0.01));
    var acc = correct + errors ? Math.round(correct / (correct + errors) * 100) : 100;
    var stars = acc >= C.stars.three ? 3 : acc >= C.stars.two ? 2 : 1;
    var d = HT.Store.data();
    if (cfg.starKey) d.stars[cfg.starKey] = Math.max(d.stars[cfg.starKey] || 0, stars);
    if (cfg.kind !== 'keys') d.bestSpeed = Math.max(d.bestSpeed, speed);
    HT.Store.touchDay(); HT.Store.save(); HT.checkBadges();
    HT.go('result', { cfg: cfg, stars: stars, speed: speed, acc: acc, secs: secs });
  }
  view.onclick = function (e) {
    if (e.target.closest('[data-back]')) return HT.go(cfg.menu);
    if (e.target.closest('[data-say]')) sayItem(items[idx]);
  };
  HT.inputHandler = onKey;
  showItem();
  return function () { clearTimeout(timer); view.onclick = null; };
};

      '<span class="target">' + it.text.split('').map(function (ch, i) {
        var cls = full || i < done ? 'done' : i === done ? 'cur' : '';
        return '<span class="ch ' + cls + (ch === ' ' ? ' sp' : '') + '">' + (ch === ' ' ? '·' : HT.esc(ch)) + '</span>';
      }).join('') + '</span>' + (it.en ? '<span class="rt-en">' + HT.esc(it.en) + '</span>' : '') + '</div>' +
      (nextItems ? '<div class="rt-next">→ ' + nextItems + '</div>' : '');
  }
  function hud() {
    var place = R.state === 'run' || R.state === 'over' ? placeOf(R.me) : 0;
    var pct = Math.round(R.me.prog * 100);
    var s = '<span class="hud-i"><small>' + HT.esc(HT.t('speed')) + '</small><b>' + liveKpm() + '</b></span>' +
      '<span class="hud-i"><small>%</small><b>' + pct + '</b></span>' +
      (place ? '<span class="hud-i"><small>' + HT.esc(HT.L('순위', 'Place')) + '</small><b>' + place + '</b></span>' : '');
    if (s !== hudCache) { HT.$('#rc-hud').innerHTML = s; hudCache = s; }
    var comp = ime.compChar();
    var typed = ime.value ? HT.esc(ime.text).replace(/ /g, '&nbsp;') + (comp ? '<span class="comp">' + HT.esc(comp) + '</span>' : '') : '<span class="ph">' + HT.esc(HT.t('typeHere')) + '</span>';
    if (typed !== typedCache) { HT.$('#rc-typed').innerHTML = typed; typedCache = typed; }
    var nk = cfg.hint && R.state === 'run' ? curItem().keys[HT.keysOf(ime.value).length] || null : null;
    if (nk !== hintCache) { HT.showNextKey(kb, HT.$('#rc-hintline'), nk); hintCache = nk; }
    if (HT.debugOn) {
      var dbg = HT.$('#rc-debug'); dbg.hidden = false;
      dbg.textContent = 'avg ' + HT.Store.playerKpm() + ' · rivals ' + R.racers.filter(function (r) { return !r.me; }).map(function (r) { return r.kpm; }).join('/') + ' · keys ' + myKeys() + '/' + R.course.total;
    }
  }
  function loop(ts) {
    raf = requestAnimationFrame(loop);
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
    update(dt); draw(); hud();
  }

  // ---- 설정/시작/끝 ----
  function setup() {
    var ov = HT.$('#rc-setup');
    ov.innerHTML = '<div class="ov-box"><h3>🏁 ' + HT.esc(HT.t('race')) + '</h3><p>' + HT.esc(HT.t('raceDesc')) + '</p>' +
      '<p class="lbl">' + HT.esc(HT.t('content')) + '</p>' + HT.segmented('rs-content', [['word', HT.t('cWord')], ['sent', HT.t('cSent')]], cfg.content) +
      '<p class="lbl">' + HT.esc(HT.t('diffSel')) + '</p>' + HT.segmented('rs-diff', [['easy', HT.t('easy')], ['normal', HT.t('normal')], ['hard', HT.t('hard')]], cfg.diff) +
      '<p class="lbl">' + HT.esc(HT.t('lengthSel')) + '</p>' + HT.segmented('rs-dist', [['short', HT.t('short')], ['normal', HT.t('normal')], ['long', HT.t('long')]], cfg.dist) +
      '<p class="note" id="rs-note"></p>' +
      '<button type="button" class="btn primary big" id="rc-start">' + HT.esc(HT.t('start')) + '</button></div>';
    function note() { HT.$('#rs-note').textContent = HT.t('rivalNote', { n: HT.Store.playerKpm() }) + ' → ' + rivalKpms().join(' / '); }
    HT.bindSegmented(ov, 'rs-content', function (v) { cfg.content = v; saveCfg(); });
    HT.bindSegmented(ov, 'rs-diff', function (v) { cfg.diff = v; saveCfg(); note(); });
    HT.bindSegmented(ov, 'rs-dist', function (v) { cfg.dist = v; saveCfg(); });
    note();
    HT.$('#rc-start').onclick = start;
    ov.hidden = false;
  }
  function saveCfg() { P.gameCfg.race = cfg; HT.Store.save(); }
  function start() {
    HT.Sfx.ensure(); HT.Sfx.click();
    R = newRace(); R.state = 'count'; R.cd = 3; ime.reset();
    HT.$('#rc-setup').hidden = true; HT.$('#rc-over').hidden = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    renderTarget();
  }
  function finish() {
    R.state = 'over'; R.endAt = performance.now();
    var place = placeOf(R.me), kpm = liveKpm(), acc = R.ok + R.bad ? Math.round(R.ok / (R.ok + R.bad) * 100) : 100;
    if (place === 1) { P.raceWins++; HT.Sfx.fanfare(); } else HT.Sfx.ok();
    // 비정상적으로 큰 값(기계 입력 등)이 실력 평균을 망치지 않도록 상한을 둠
    var counted = Math.min(kpm, C.cpuKpmMax);
    if (acc >= C.minAccuracyToCount && counted > 0) { P.raceKpms.push(counted); P.raceKpms = P.raceKpms.slice(-20); }
    P.bestSpeed = Math.max(P.bestSpeed, counted);
    P.keysTyped += R.ok;
    HT.Store.touchDay(); HT.Store.save();
    var order = R.racers.slice().sort(function (a, b) { return placeOf(a) - placeOf(b); });
    var ov = HT.$('#rc-over');
    ov.innerHTML = '<div class="ov-box"><h3>' + HT.esc(HT.t('raceDone')) + '</h3>' +
      '<p class="place">' + (place === 1 ? '🥇' : place === 2 ? '🥈' : place === 3 ? '🥉' : '🏅') + ' ' + HT.esc(HT.t('rank', { n: place })) + '</p>' +
      '<ol class="podium">' + order.map(function (r) {
        return '<li' + (r.me ? ' class="me"' : '') + '><span>' + HT.esc(r.emoji) + ' ' + HT.esc(r.name) + '</span><small>' + (r.me ? kpm : r.kpm) + ' ' + HT.esc(HT.t('speedUnit')) + '</small></li>';
      }).join('') + '</ol>' +
      '<div class="statbar"><div class="stat"><small>' + HT.esc(HT.t('yourSpeed')) + '</small><b>' + kpm + '</b></div>' +
      '<div class="stat"><small>' + HT.esc(HT.t('acc')) + '</small><b>' + acc + '%</b></div></div>' +
      '<p class="tipbox">' + HT.tipHTML(HT.randomTip()) + '</p>' +
      '<div class="actions"><button type="button" class="btn primary" id="rc-again">' + HT.esc(HT.t('retry')) + '</button>' +
      '<button type="button" class="btn" id="rc-setup-b">' + HT.esc(HT.t('content')) + '</button></div></div>';
    ov.hidden = false;
    HT.$('#rc-again').onclick = start;
    HT.$('#rc-setup-b').onclick = function () { ov.hidden = true; R = newRace(); renderTarget(); setup(); };
    HT.checkBadges();
  }

  HT._gameCtl = {
    levelUp: function () { /* 레이스에는 레벨 없음 */ },
    heart: function () {},
    god: function () { R.me.prog = Math.min(1, R.me.prog + 0.1); R.doneKeys = Math.round(R.course.total * R.me.prog); },
    end: function () { if (R.state === 'run') { R.doneKeys = R.course.total; ime.reset(); } }
  };

  view.onclick = function (e) {
    if (e.target.closest('[data-back]')) return HT.go('home');
    var hb = e.target.closest('#rc-hint');
    if (hb) { cfg.hint = !cfg.hint; hb.setAttribute('aria-pressed', String(cfg.hint)); hintCache = undefined; saveCfg(); }
  };
  addEventListener('resize', resize);
  resize(); setup(); renderTarget();
  HT.inputHandler = onKey;
  raf = requestAnimationFrame(loop);
  return function () { cancelAnimationFrame(raf); removeEventListener('resize', resize); view.onclick = null; HT._gameCtl = null; HT._raceDebug = null; };
};

// ==== app.js ====
// 화면 이동, 위쪽 막대(언어/소리), 디버그 패널, 시작
var HT = globalThis.HT = globalThis.HT || {};

HT.route = null;
HT._cleanup = null;
HT.go = function (name, arg) {
  if (HT._cleanup) { try { HT._cleanup(); } catch (e) { console.error(e); } }
  HT._cleanup = null; HT.inputHandler = null; HT.activeKeyboard = null;
  if (!HT.Store.profile() && name !== 'profiles') name = 'profiles';
  HT.route = { name: name, arg: arg };
  var view = HT.$('#view');
  view.className = 'view v-' + name;
  window.scrollTo(0, 0);
  HT._cleanup = HT.Views[name](arg) || null;
  HT.renderHeader();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
};

HT.renderHeader = function () {
  var s = HT.Store.settings(), p = HT.Store.profile();
  HT.$('#top-actions').innerHTML =
    (p ? '<button type="button" class="btn small who" id="hd-who" title="' + HT.esc(HT.t('change')) + '">' + HT.esc(p.avatar) + ' ' + HT.esc(p.name) + '</button>' : '') +
    '<button type="button" class="btn small" id="hd-lang">' + HT.esc(HT.t('langToggle')) + '</button>' +
    '<button type="button" class="btn small toggle" id="hd-sfx" aria-pressed="' + (s.sound !== false) + '" title="' + HT.esc(HT.t('soundFx')) + '">' + (s.sound !== false ? '🔊' : '🔇') + '</button>' +
    '<button type="button" class="btn small toggle" id="hd-say" aria-pressed="' + (s.speech !== false) + '" title="' + HT.esc(HT.t('readAloud')) + '">🗣️</button>';
  HT.$('#app-title').textContent = HT.t('appName');
  document.documentElement.lang = HT.lang;
  HT.renderSide();
};

// PC는 반응형이 아니라 따로 짠 가로 구성(옆판 + 넓은 본문). 모바일 전용 구성은 다음 단계에서 따로 만듭니다.
HT.layout = (globalThis.innerWidth || 1280) >= 1024 ? 'pc' : 'mobile';
HT.NAV = [
  ['home', '🏝️', 'home'], ['keysMenu', 'ㄱ', 'keys'], ['wordsMenu', '가', 'words'], ['sentence', '글', 'sent'], ['storyMenu', '📖', 'story'],
  ['rain', '☔', 'rain'], ['balloon', '🎈', 'balloon'], ['race', '🏁', 'race']
];
HT.renderSide = function () {
  var el = HT.$('#side-body');
  if (!el) return;
  var p = HT.Store.profile();
  if (HT.layout !== 'pc' || !p) { el.innerHTML = ''; return; }
  var d = HT.Store.data(), cur = HT.route && HT.route.name;
  var group = { practice: 'keysMenu wordsMenu practice result storyMenu story', home: 'home' };
  el.innerHTML = '<div class="side-me"><div class="side-av" aria-hidden="true">' + HT.esc(p.avatar) + '</div>' +
    '<div class="side-name">' + HT.esc(p.name) + '</div>' +
    '<div class="side-stats"><span>🔥 ' + HT.esc(HT.t('days', { n: d.streak })) + '</span><span>⭐ ' + HT.Store.totalStars() + '</span><span>📚 ' + d.wordsTyped + '</span></div></div>' +
    '<nav class="side-nav">' + HT.NAV.map(function (n) {
      var on = cur === n[0] || (n[0] === 'sentence' && cur === 'practice' && HT.route.arg && HT.route.arg.kind === 'sent') ||
        (n[0] === 'storyMenu' && cur === 'story') ||
        (n[0] === 'keysMenu' && cur === 'practice' && HT.route.arg && HT.route.arg.kind === 'keys') ||
        (n[0] === 'wordsMenu' && cur === 'practice' && HT.route.arg && HT.route.arg.kind === 'words');
      return '<button type="button" class="nav-b' + (on ? ' on' : '') + '" data-nav="' + n[0] + '"><span class="nav-i">' + n[1] + '</span>' + HT.esc(HT.t(n[2])) + '</button>';
    }).join('') + '</nav>';
};

HT.applySettings = function () {
  var s = HT.Store.settings();
  HT.lang = s.lang || ((navigator.language || 'ko').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en');
  HT.Sfx.on = s.sound !== false;
  HT.Speech.on = s.speech !== false;
};

// ---- 디버그 패널: 주소 끝 #debug 또는 로고 5번 누르기 ----
HT.debugOn = false;
HT.openDebug = function () {
  HT.debugOn = true;
  var el = HT.$('#debug-panel');
  el.hidden = false;
  el.innerHTML = '<div class="dbg-head"><b>🛠 ' + HT.esc(HT.t('debug')) + '</b><button type="button" class="btn small" id="dbg-close">✕</button></div>' +
    '<div class="dbg-row"><button type="button" class="btn small" data-dbg="levelUp">LV +1</button><button type="button" class="btn small" data-dbg="heart">♥ +1</button>' +
    '<button type="button" class="btn small" data-dbg="god">GOD / +10%</button><button type="button" class="btn small" data-dbg="end">END</button></div>' +
    '<label for="dbg-cfg">CONFIG (JSON) — 바꾼 값만 저장돼요 / only changed values are saved</label>' +
    '<textarea id="dbg-cfg" spellcheck="false"></textarea>' +
    '<div class="dbg-row"><button type="button" class="btn small primary" id="dbg-save">저장 Save</button><button type="button" class="btn small" id="dbg-reset">기본값 Reset</button>' +
    '<button type="button" class="btn small danger" id="dbg-wipe">기록 전체 삭제 Wipe data</button></div><p class="dbg-msg" id="dbg-msg"></p>';
  HT.$('#dbg-cfg').value = JSON.stringify(HT.CONFIG, null, 2);
  el.onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var msg = HT.$('#dbg-msg');
    if (b.id === 'dbg-close') { el.hidden = true; HT.debugOn = false; document.querySelectorAll('.debug-hud').forEach(function (d) { d.hidden = true; }); return; }
    if (b.dataset.dbg) { if (HT._gameCtl) HT._gameCtl[b.dataset.dbg](); else msg.textContent = '게임 화면에서 쓰세요 / open a game first'; return; }
    if (b.id === 'dbg-save') {
      try {
        var next = JSON.parse(HT.$('#dbg-cfg').value);
        var diff = HT.configDiff(HT.DEFAULT_CONFIG, next);
        localStorage.setItem(HT.CONFIG_KEY, JSON.stringify(diff));
        HT.loadConfig();
        msg.textContent = '저장됨. 다음 판부터 적용 / Saved. Applies from the next round.';
      } catch (err) { msg.textContent = 'JSON 오류 / JSON error: ' + err.message; }
    }
    if (b.id === 'dbg-reset') {
      try { localStorage.removeItem(HT.CONFIG_KEY); } catch (e2) { /* 무시 */ }
      HT.loadConfig(); HT.$('#dbg-cfg').value = JSON.stringify(HT.CONFIG, null, 2); msg.textContent = '기본값으로 되돌림 / Reset to defaults';
    }
    if (b.id === 'dbg-wipe') {
      if (b.dataset.armed) { try { localStorage.removeItem(HT.Store.KEY); } catch (e3) { /* 무시 */ } HT.Store.load(); HT.go('profiles'); msg.textContent = 'wiped'; }
      else { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 삭제 / Tap again'; }
    }
  };
};
HT.configDiff = function (base, next) {
  var out = {};
  Object.keys(next).forEach(function (k) {
    if (!(k in base)) return;
    var b = base[k], n = next[k];
    if (b && typeof b === 'object' && !Array.isArray(b) && n && typeof n === 'object') {
      var sub = HT.configDiff(b, n);
      if (Object.keys(sub).length) out[k] = sub;
    } else if (JSON.stringify(b) !== JSON.stringify(n)) out[k] = n;
  });
  return out;
};

HT.boot = function () {
  document.documentElement.classList.add(HT.layout);
  HT.Store.load();
  HT.$('#side-body').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]'); if (!b) return;
    HT.Sfx.click();
    if (b.dataset.nav === 'sentence') HT.startSentences(); else HT.go(b.dataset.nav);
  });
  HT.applySettings();
  HT.Speech.init();
  var logoTaps = 0, logoT = 0;
  HT.$('#app-title').addEventListener('click', function () {
    var now = Date.now();
    logoTaps = now - logoT < 600 ? logoTaps + 1 : 1; logoT = now;
    if (logoTaps >= 5) { logoTaps = 0; HT.openDebug(); return; }
    if (HT.route && HT.route.name !== 'home' && HT.Store.profile()) HT.go('home');
  });
  HT.$('#top-actions').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var s = HT.Store.settings();
    if (b.id === 'hd-who') { HT.Sfx.click(); HT.go('profiles'); return; }
    if (b.id === 'hd-lang') {
      s.lang = HT.lang === 'ko' ? 'en' : 'ko'; HT.Store.save(); HT.applySettings();
      // 게임/연습 도중이면 진행을 지키기 위해 막대만 바꾸고, 목록 화면은 다시 그림
      var live = ['practice', 'rain', 'balloon', 'race', 'story'].indexOf(HT.route.name) >= 0;
      if (live) HT.renderHeader(); else HT.go(HT.route.name, HT.route.arg);
    }
    if (b.id === 'hd-sfx') { s.sound = s.sound === false; HT.Store.save(); HT.applySettings(); HT.renderHeader(); HT.Sfx.click(); }
    if (b.id === 'hd-say') { s.speech = s.speech === false; HT.Store.save(); HT.applySettings(); HT.renderHeader(); }
  });
  if (location.hash === '#debug') HT.openDebug();
  HT.go(HT.Store.profile() ? 'home' : 'profiles');
};

if (typeof document !== 'undefined' && document.getElementById('view')) HT.boot();

</script>
