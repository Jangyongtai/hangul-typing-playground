<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>한글톡톡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Press+Start+2P&display=swap">
<style>
/* Layout: 오락실 느낌 — 하늘색 바탕 위 굵은 테두리의 픽셀 패널, 게임 화면은 어두운 브라운관 창 */
:root {
  --sky: #CDEBFF;
  --panel: #FFFFFF;
  --ink: #1D2B53;
  --muted: #4F5B7D;
  --yellow: #FFEC27;
  --orange: #FFA300;
  --red: #FF004D;
  --pink: #FF77A8;
  --green: #00B543;
  --ok: #00873A;
  --blue: #29ADFF;
  --plum: #7E2553;
  --peach: #FFF1E8;
  --f-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --f-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --f-pixel: 'Press Start 2P', 'Courier New', monospace;
  --edge: 3px solid var(--ink);
  --pop: 4px 4px 0 var(--ink);
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); }
body {
  margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  background-image: radial-gradient(rgba(29, 43, 83, 0.09) 1.5px, transparent 1.7px);
  background-size: 22px 22px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.wrap {
  max-width: 1000px; margin: 0 auto; padding-block: 10px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 위쪽 막대 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.logo {
  background: var(--yellow); border: var(--edge); box-shadow: var(--pop); border-radius: 10px;
  font-family: var(--f-display); font-size: 22px; padding: 4px 14px; cursor: pointer;
}
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* 버튼 */
.btn {
  background: var(--panel); border: var(--edge); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink);
  padding: 8px 16px; font-family: var(--f-display); font-size: 17px; cursor: pointer; transition: transform .06s;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.small { padding: 4px 10px; font-size: 15px; }
.btn.primary { background: var(--pink); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
.btn.danger { background: var(--red); color: #fff; }
.btn.big { font-size: 22px; padding: 10px 28px; }
.btn.toggle[aria-pressed="false"] { background: #DDE3EE; opacity: .75; }
.btn.who { background: var(--peach); }

/* 공통 패널 */
.panel { background: var(--panel); border: var(--edge); border-radius: 14px; box-shadow: var(--pop); padding: 20px; }
h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 26px; }
h2.sec { font-size: 22px; margin: 22px 0 10px; }
.lbl { margin: 12px 0 6px; font-family: var(--f-display); font-size: 16px; }
.note { color: var(--muted); font-size: 14px; text-align: center; margin: 10px 0 0; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.bar h2 { flex: 1; min-width: 0; font-size: 24px; }

/* 처음 화면 */
.hero { display: flex; align-items: center; gap: 14px; }
.mascot {
  font-size: 64px; line-height: 1; background: var(--orange); border: var(--edge); border-radius: 16px; box-shadow: var(--pop);
  width: 96px; height: 96px; display: grid; place-items: center; flex: none; animation: bob 2.4s ease-in-out infinite;
}
.bubble {
  position: relative; background: var(--panel); border: var(--edge); border-radius: 14px; box-shadow: var(--pop);
  padding: 12px 16px; margin: 0; font-family: var(--f-display); font-size: 19px; min-width: 0;
}
.statbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 16px; }
.stat { background: var(--panel); border: var(--edge); border-radius: 12px; padding: 8px 12px; text-align: center; }
.stat small { display: block; color: var(--muted); font-size: 13px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.mode-card {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
  background: var(--panel); border: var(--edge); border-radius: 14px; box-shadow: var(--pop); padding: 14px 16px; cursor: pointer;
  transition: transform .08s;
}
.mode-card:hover { transform: translate(-1px, -2px); }
.mode-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.glyph {
  font-family: var(--f-display); font-size: 34px; line-height: 1; background: var(--sky); border: 2px solid var(--ink);
  border-radius: 10px; min-width: 52px; height: 52px; display: grid; place-items: center; padding: 0 8px; margin-bottom: 8px;
}
.glyph.small { font-size: 20px; letter-spacing: 1px; }
.games .mode-card:nth-child(1) .glyph { background: #3A1D4A; color: #fff; }
.games .mode-card:nth-child(2) .glyph { background: var(--blue); }
.games .mode-card:nth-child(3) .glyph { background: var(--green); }
.mc-t { font-family: var(--f-display); font-size: 20px; }
.mc-d { color: var(--muted); font-size: 14px; }
.mc-best { position: absolute; top: 12px; right: 12px; font-family: var(--f-display); font-size: 15px; }
.st-no { font-family: var(--f-pixel); font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.more { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.badge { background: #E8EDF5; border: 2px dashed #9AA6C2; border-radius: 12px; padding: 8px 4px; text-align: center; color: var(--muted); }
.badge span { display: block; font-size: 26px; }
.badge small { font-size: 12px; }
.badge.on { background: var(--panel); border: 2px solid var(--ink); color: var(--ink); }
.stars .st { color: #C8D0E0; font-size: 18px; }
.stars .st.on { color: var(--orange); text-shadow: 1px 1px 0 var(--ink); }

/* 사용자 고르기 */
.profiles h2 { margin-bottom: 14px; }
.profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.profile-card { position: relative; }
.pf-use {
  width: 100%; background: var(--sky); border: var(--edge); border-radius: 14px; box-shadow: var(--pop); padding: 14px 8px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.pf-av { font-size: 48px; line-height: 1.1; }
.pf-name { font-family: var(--f-display); font-size: 20px; overflow-wrap: anywhere; }
.pf-del { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); background: var(--panel); cursor: pointer; font-size: 13px; }
.pf-confirm { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.pf-confirm small { color: var(--red); }
.new-profile { margin-top: 22px; border-top: 3px dashed #B9C4DA; padding-top: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.new-profile label { font-family: var(--f-display); }
.new-profile input { font: inherit; font-size: 20px; border: var(--edge); border-radius: 10px; padding: 8px 12px; width: min(320px, 100%); background: var(--peach); color: var(--ink); }
.avatar-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.av-b { font-size: 30px; width: 54px; height: 54px; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); cursor: pointer; }
.av-b[aria-pressed="true"] { background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
.form-err { color: var(--red); margin: 0; }

/* 연습 화면 */
.meters { display: flex; gap: 8px; }
.meter { background: var(--panel); border: 2px solid var(--ink); border-radius: 10px; padding: 2px 10px; text-align: center; min-width: 74px; }
.meter small { display: block; font-size: 11px; color: var(--muted); }
.meter b { font-family: var(--f-display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; }
.progress { height: 12px; background: var(--panel); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.progress div { height: 100%; background: repeating-linear-gradient(90deg, var(--green) 0 10px, #00E436 10px 20px); transition: width .3s; }
.target-card {
  position: relative; background: var(--panel); border: var(--edge); border-radius: 16px; box-shadow: var(--pop);
  padding: 18px 16px 16px; text-align: center; min-height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.target-card.shake { animation: shake .25s; }
.target-card.win { background: #EFFFF3; }
.emoji { font-size: 56px; line-height: 1.1; }
.big-jamo { font-family: var(--f-display); font-size: clamp(72px, 16vw, 120px); line-height: 1; }
.target { font-family: var(--f-display); font-size: clamp(36px, 8vw, 64px); line-height: 1.2; overflow-wrap: anywhere; }
.pv-sent .target { font-size: clamp(26px, 5.6vw, 44px); }
.ch { color: rgba(29, 43, 83, 0.35); }
.ch.done { color: var(--ok); }
.ch.cur { color: var(--ink); background: var(--yellow); border-radius: 6px; box-shadow: inset 0 -4px 0 var(--orange); }
.ch.sp { padding: 0 .15em; }
.sub { color: var(--muted); font-size: 17px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sub .rom { font-style: italic; }
.sub .en { color: var(--ink); font-weight: 700; }
.tag { font-size: 13px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
.say { position: absolute; top: 10px; right: 10px; font-size: 22px; border: 2px solid var(--ink); border-radius: 10px; background: var(--sky); cursor: pointer; width: 44px; height: 44px; }
.praise { position: absolute; top: 12px; left: 12px; font-family: var(--f-display); font-size: 20px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 10px; padding: 2px 10px; animation: popin .3s; }
.typed {
  margin-top: 12px; min-height: 52px; background: var(--peach); border: var(--edge); border-radius: 12px; padding: 6px 14px;
  font-family: var(--f-display); font-size: 28px; display: flex; align-items: center; justify-content: center; overflow-wrap: anywhere; text-align: center;
}
.typed .comp { text-decoration: underline 3px var(--blue); text-underline-offset: 6px; }
.typed .ph { color: #9AA6C2; font-size: 16px; font-family: var(--f-body); }
.typed.bad { animation: shake .25s; background: #FFE3EA; }
.hintline { text-align: center; margin: 8px 0; font-size: 16px; min-height: 26px; }
.hintline kbd { font-family: var(--f-display); font-size: 20px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 6px; padding: 0 8px; }
.hintline .letter { font-family: var(--f-pixel); font-size: 11px; }
.tipbox { background: #FFF8C4; border: 2px dashed var(--orange); border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-size: 15px; }
.tip-ko { color: var(--muted); }

/* 화면 자판 */
.kb { display: flex; flex-direction: column; gap: 5px; max-width: 760px; margin: 8px auto 0; user-select: none; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.kb-row.r1 { padding-left: 3%; }
.key {
  position: relative; flex: 1 1 0; max-width: 64px; min-width: 0; height: 52px; border: 2px solid var(--ink); border-radius: 9px;
  background: var(--panel); box-shadow: 0 3px 0 var(--ink); cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
.key b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.key i { position: absolute; top: 2px; left: 5px; font-style: normal; font-family: var(--f-pixel); font-size: 8px; color: var(--muted); }
.key.wide { flex: 1.5 1 0; max-width: 92px; font-size: 20px; background: #E8EDF5; }
.key.space { flex: 0 1 380px; max-width: 380px; font-family: var(--f-display); font-size: 16px; }
.key.on { background: var(--blue); color: #fff; }
.key.bump::after { content: ''; position: absolute; bottom: 7px; width: 14px; height: 3px; border-radius: 2px; background: var(--ink); }
.key.f0, .key.f7 { border-bottom-color: var(--pink); }
.key.f1, .key.f6 { border-bottom-color: var(--orange); }
.key.f2, .key.f5 { border-bottom-color: var(--green); }
.key.f3, .key.f4 { border-bottom-color: var(--blue); }
.key.f0, .key.f1, .key.f2, .key.f3, .key.f4, .key.f5, .key.f6, .key.f7 { border-bottom-width: 6px; }
.key.hint { background: var(--yellow); animation: nudge .7s ease-in-out infinite; }
.key.press { animation: press .15s; }

/* 게임 화면 */
.hud { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hud-i { background: var(--ink); color: var(--peach); border-radius: 8px; padding: 2px 10px; text-align: center; min-width: 62px; }
.hud-i small { display: block; font-size: 10px; opacity: .8; }
.hud-i b { font-family: var(--f-pixel); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; }
.hearts { color: var(--red); font-size: 20px; letter-spacing: 1px; text-shadow: 1px 1px 0 var(--ink); }
.hearts .lost { color: #C8D0E0; text-shadow: none; }
.screen { position: relative; border: 4px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: var(--pop); background: #0B1230; }
.screen canvas { display: block; width: 100%; }
.screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.07) 0 2px, transparent 2px 4px); }
.overlay { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: rgba(11, 18, 48, 0.55); padding: 12px; overflow-y: auto; }
.ov-box { background: var(--panel); border: var(--edge); border-radius: 14px; box-shadow: var(--pop); padding: 16px 18px; width: min(520px, 100%); text-align: center; max-height: 100%; overflow-y: auto; }
.ov-box h3 { font-size: 28px; }
.ov-box p { margin: 6px 0; }
.ov-box .statbar { margin-top: 8px; }
.seg { display: inline-flex; border: var(--edge); border-radius: 10px; overflow: hidden; flex-wrap: wrap; justify-content: center; }
.seg-b { border: 0; border-right: 2px solid var(--ink); background: var(--panel); padding: 6px 14px; font-family: var(--f-display); font-size: 17px; cursor: pointer; }
.seg-b:last-child { border-right: 0; }
.seg-b[aria-pressed="true"] { background: var(--yellow); }
.best { font-family: var(--f-display); }
.newbest { font-family: var(--f-display); font-size: 22px; color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { border: 2px solid var(--ink); border-radius: 999px; background: var(--sky); padding: 2px 10px; cursor: pointer; font-family: var(--f-display); font-size: 16px; }
.chip small { font-family: var(--f-body); color: var(--muted); }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.gin { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
.gin .typed { flex: 1; margin: 0; min-width: 0; }
.debug-hud { position: absolute; left: 6px; bottom: 6px; z-index: 3; background: rgba(0, 0, 0, .7); color: #0f0; font: 11px/1.3 monospace; padding: 2px 6px; border-radius: 4px; }

/* 레이스 */
.race-target { margin-top: 10px; background: var(--panel); border: var(--edge); border-radius: 14px; box-shadow: var(--pop); padding: 10px 14px; text-align: center; min-height: 60px; }
.race-target:empty { display: none; }
.rt-main { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.rt-emoji { font-size: 36px; }
.race-target .target { font-size: clamp(30px, 6vw, 48px); }
.rt-en { color: var(--muted); font-weight: 700; }
.rt-next { color: var(--muted); font-size: 15px; }
.place { font-family: var(--f-display); font-size: 30px; }
.podium { list-style: none; padding: 0; margin: 6px auto; max-width: 300px; text-align: left; counter-reset: pl; }
.podium li { counter-increment: pl; display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-bottom: 2px dashed #D5DCEA; font-family: var(--f-display); }
.podium li::before { content: counter(pl) '.'; font-family: var(--f-pixel); font-size: 11px; align-self: center; width: 24px; }
.podium li span { flex: 1; }
.podium li.me { background: var(--yellow); border-radius: 8px; }

/* 결과 */
.result { text-align: center; }
.big-stars .st { font-size: 56px; }
.big-stars .st.on { animation: popin .5s backwards; }
.big-stars .st.on:nth-child(2) { animation-delay: .15s; }
.big-stars .st.on:nth-child(3) { animation-delay: .3s; }

/* 알림, 디버그 */
.toast {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 20;
  background: var(--yellow); border: var(--edge); border-radius: 12px; box-shadow: var(--pop); padding: 8px 16px;
  font-family: var(--f-display); font-size: 18px; max-width: calc(100% - 32px);
}
.toast.show { animation: popin .3s; }
.toast-badge { font-size: 24px; }
.debug-panel {
  position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  width: min(420px, calc(100% - 16px)); max-height: 70vh; overflow-y: auto; background: #111A33; color: #E8EDF5;
  border: 3px solid var(--yellow); border-radius: 12px; padding: 10px; font-size: 13px;
}
.debug-panel .btn { color: var(--ink); }
.dbg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.dbg-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.debug-panel textarea { width: 100%; height: 220px; font: 12px/1.35 monospace; background: #0B1230; color: #9FE; border: 1px solid #456; border-radius: 6px; }
.dbg-msg { color: var(--yellow); margin: 4px 0 0; }

@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes popin { from { transform: scale(.4); opacity: 0; } }
@keyframes nudge { 50% { transform: translateY(-3px); } }
@keyframes press { 50% { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); } }

@media (max-width: 600px) {
  h2 { font-size: 22px; }
  .bar h2 { font-size: 20px; }
  .mascot { width: 72px; height: 72px; font-size: 46px; }
  .bubble { font-size: 16px; }
  .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-card { padding: 12px; }
  .mc-t { font-size: 17px; }
  .mc-d { font-size: 12px; }
  .key { height: 44px; border-radius: 7px; }
  .key b { font-size: 18px; }
  .key i { font-size: 6px; }
  .kb, .kb-row { gap: 3px; }
  .typed { font-size: 24px; }
  .emoji { font-size: 44px; }
  .meter { min-width: 60px; }
  .hud-i { min-width: 50px; padding: 2px 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
<div class="wrap">
  <header class="top">
    <button type="button" class="logo" id="app-title">한글톡톡</button>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <main id="view" class="view"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<aside id="debug-panel" class="debug-panel" hidden></aside>
<script>
// ==== config.js ====
// 조정값은 모두 여기에 모아 둡니다. 숫자만 바꾸면 게임 난이도가 바뀝니다.
// 화면 주소 끝에 #debug 를 붙이면(또는 로고를 5번 누르면) 디버그 패널에서 실시간으로 바꿔 볼 수 있습니다.
var HT = globalThis.HT = globalThis.HT || {};

HT.DEFAULT_CONFIG = {
  practice: {
    keysPerStage: 15,        // 자리 익히기 한 단계 문제 수
    reviewRatio: 0.3,        // 이전 단계 복습 비율
    wordsPerRound: 8,        // 낱말 연습 한 판 낱말 수

HT.loadConfig = function () {
  var base = JSON.parse(JSON.stringify(HT.DEFAULT_CONFIG));
  try {
    var raw = globalThis.localStorage && localStorage.getItem(HT.CONFIG_KEY);
    if (raw) HT.deepMerge(base, JSON.parse(raw));
  } catch (e) { /* 저장소를 못 쓰면 기본값 사용 */ }
  HT.CONFIG = base;
  return base;
};

HT.deepMerge = function (target, src) {
  if (!src || typeof src !== 'object') return target;
  Object.keys(src).forEach(function (k) {
    var v = src[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
      HT.deepMerge(target[k], v);
    } else if (k in target) {
      target[k] = v;
    }
  });
  return target;
};

// 두벌식 한글 조합기. 영문 자판 키를 받아 한글 글자를 만듭니다. (한글 입력기 설치 불필요)
var HT = globalThis.HT = globalThis.HT || {};

(function () {
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  var JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  var JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  var VCOMB = { 'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ', 'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ', 'ㅡㅣ': 'ㅢ' };
  var CCOMB = { 'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ' };
  var SPLIT = {};
  [VCOMB, CCOMB].forEach(function (m) {
    Object.keys(m).forEach(function (k) { SPLIT[m[k]] = [k[0], k[1]]; });
  });

  function isVowel(j) { return JUNG.indexOf(j) >= 0; }
  function isCons(j) { return CHO.indexOf(j) >= 0 || !!SPLIT[j] && !isVowel(j); }

  function composeBlock(c) {
    if (c.c && c.v) {
      return String.fromCharCode(0xAC00 + (CHO.indexOf(c.c) * 21 + JUNG.indexOf(c.v)) * 28 + JONG.indexOf(c.f));
    }
    return c.c || c.v || '';
  }

  function Hangul() { this.reset(); }
  Hangul.prototype.reset = function () { this.text = ''; this.comp = { c: '', v: '', f: '' }; };
  Hangul.prototype.compChar = function () { return composeBlock(this.comp); };
  Object.defineProperty(Hangul.prototype, 'value', { get: function () { return this.text + composeBlock(this.comp); } });
  Hangul.prototype.commit = function () { this.text += composeBlock(this.comp); this.comp = { c: '', v: '', f: '' }; };
  Hangul.prototype.snapshot = function () { return { text: this.text, comp: { c: this.comp.c, v: this.comp.v, f: this.comp.f } }; };
  Hangul.prototype.restore = function (s) { this.text = s.text; this.comp = { c: s.comp.c, v: s.comp.v, f: s.comp.f }; };

  Hangul.prototype.input = function (j) {
    var c = this.comp;
    if (isVowel(j)) {
      if (c.f) {
        // 받침이 다음 글자 첫소리로 넘어감: 각 + ㅏ → 가가
        var parts = SPLIT[c.f];
        var moved;
        if (parts) { c.f = parts[0]; moved = parts[1]; } else { moved = c.f; c.f = ''; }
        this.commit();
        this.comp = { c: moved, v: j, f: '' };
      } else if (c.v) {
        var m = VCOMB[c.v + j];
        if (m) c.v = m; else { this.commit(); this.comp = { c: '', v: j, f: '' }; }
      } else if (c.c) {
        c.v = j;
      } else {
        this.comp = { c: '', v: j, f: '' };
      }
    } else if (isCons(j)) {
      if (c.f) {
        var cf = CCOMB[c.f + j];
        if (cf) c.f = cf; else { this.commit(); this.comp = { c: j, v: '', f: '' }; }
      } else if (c.v) {
        if (c.c && JONG.indexOf(j) > 0) c.f = j;
        else { this.commit(); this.comp = { c: j, v: '', f: '' }; }
      } else if (c.c) {
        this.commit(); this.comp = { c: j, v: '', f: '' };
      } else {
        c.c = j;
      }
    } else {
      this.char(j);
    }
  };

  Hangul.prototype.space = function () { this.commit(); this.text += ' '; };
  Hangul.prototype.char = function (ch) { this.commit(); this.text += ch; };

  // 지우기: 조합 중이면 자모 하나씩, 아니면 글자 하나
  Hangul.prototype.backspace = function () {
    var c = this.comp, p;
    if (c.f) { p = SPLIT[c.f]; c.f = p ? p[0] : ''; }
    else if (c.v) { p = SPLIT[c.v]; c.v = p ? p[0] : ''; }
    else if (c.c) { c.c = ''; }
    else if (this.text) { this.text = this.text.slice(0, -1); }
  };

  // 글자를 실제로 눌러야 하는 키(자모) 순서로 풀어냅니다. 과 → ㄱ ㅗ ㅏ
  function keysOf(str) {
    var out = [];
    function push(j) { var p = SPLIT[j]; if (p) { out.push(p[0], p[1]); } else out.push(j); }
    for (var i = 0; i < str.length; i++) {
      var ch = str[i], code = ch.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        var n = code - 0xAC00;
        out.push(CHO[Math.floor(n / 588)]);
        push(JUNG[Math.floor((n % 588) / 28)]);
        var jong = n % 28;
        if (jong) push(JONG[jong]);
      } else {
        push(ch);
      }
    }
    return out;
  }

  function isPrefix(a, b) {
    if (a.length > b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  HT.Hangul = Hangul;
  HT.keysOf = keysOf;
  HT.isPrefix = isPrefix;
  HT.isVowel = isVowel;
  HT.composeBlock = composeBlock;
})();

// ---- 키 입력 ----
// 현재 화면이 HT.inputHandler 를 등록하면 실제 키보드와 화면 자판 입력이 모두 여기로 옵니다.
// 입력 형식: {type:'jamo', j:'ㄱ', code:'KeyR'} | {type:'space'} | {type:'bs'} | {type:'enter'} | {type:'esc'} | {type:'char', ch}
HT.inputHandler = null;
HT.activeKeyboard = null;

HT.keyFromEvent = function (e) {
  if (e.key === 'Backspace') return { type: 'bs' };
  if (e.key === 'Enter') return { type: 'enter' };
  if (e.key === 'Escape') return { type: 'esc' };
  if (e.key === ' ' || e.code === 'Space') return { type: 'space', code: 'Space' };
  var m = HT.CODE2JAMO[e.code];
  if (m) return { type: 'jamo', j: e.shiftKey && m[1] ? m[1] : m[0], code: e.code };
  if (e.key && e.key.length === 1) {
    var jk = HT.JAMO2KEY[e.key];
    if (jk) return { type: 'jamo', j: e.key, code: jk.code };
    var letter = e.key.toUpperCase();
    if (/^[A-Z]$/.test(letter) && HT.CODE2JAMO['Key' + letter]) {
      var mm = HT.CODE2JAMO['Key' + letter];
      return { type: 'jamo', j: e.shiftKey && mm[1] ? mm[1] : mm[0], code: 'Key' + letter };
    }

  if (HT.activeKeyboard && k.code) HT.activeKeyboard.press(k.code);

// ---- 문제 만들기 ----
HT.noRepeatNeighbors = function (list) {
  for (var i = 1; i < list.length; i++) {
    if (list[i].text === list[i - 1].text) {
      for (var j = i + 1; j < list.length; j++) {
        if (list[j].text !== list[i - 1].text) { var t = list[i]; list[i] = list[j]; list[j] = t; break; }
      }
    }
  }
  return list;
};

HT.startKeysStage = function (idx) {
  var C = HT.CONFIG.practice, st = HT.STAGES[idx], items;
  if (!st.jamo) {
    items = HT.shuffle(HT.SYLLABLES).slice(0, 12).map(function (s) { return { text: s }; });
  } else {
    var pool = st.jamo.split(''), prev = HT.STAGES.slice(0, idx).map(function (s) { return s.jamo; }).join('').split('').filter(Boolean);
    var nReview = prev.length ? Math.round(C.keysPerStage * C.reviewRatio) : 0, list = [];
    while (list.length < C.keysPerStage - nReview) list = list.concat(HT.shuffle(pool));
    list = list.slice(0, C.keysPerStage - nReview);
    for (var i = 0; i < nReview; i++) list.push(HT.pick(prev));
    items = HT.noRepeatNeighbors(HT.shuffle(list).map(function (j) { return { text: j, jamo: true }; }));
  }
  HT.go('practice', {
    kind: 'keys', title: HT.L(st.ko, st.en), starKey: 'keys-' + st.id, items: items, tip: HT.TIPS[st.tip],
    again: function () { HT.startKeysStage(idx); },
    next: idx + 1 < HT.STAGES.length ? function () { HT.startKeysStage(idx + 1); } : null,
    menu: 'keysMenu'
  });
};

HT.startWords = function (themeId) {
  var C = HT.CONFIG.practice, d = HT.Store.data(), items;
  var missed = Object.keys(d.missed).filter(function (w) { return HT.WORD_INDEX[w]; })
    .sort(function (a, b) { return d.missed[b] - d.missed[a]; });
  var title;
  if (themeId === 'review') {
    items = missed.slice(0, C.wordsPerRound).map(function (w) { return HT.WORD_INDEX[w]; });
    title = HT.t('review');
  } else {
    var th = HT.THEMES.filter(function (x) { return x.id === themeId; })[0];
    title = HT.L(th.ko, th.en);
    items = HT.shuffle(HT.ALL_WORDS.filter(function (w) { return w.theme === themeId; })).slice(0, C.wordsPerRound);
    var extra = missed.filter(function (w) { return HT.WORD_INDEX[w].theme !== themeId; }).slice(0, C.reviewInRound);
    extra.forEach(function (w, i) { var at = items.length - 1 - i; if (at >= 0) items[at] = Object.assign({ review: true }, HT.WORD_INDEX[w]); });
    items = HT.shuffle(items);
  }
  HT.go('practice', {
    kind: 'words', title: title, starKey: themeId === 'review' ? null : 'words-' + themeId, items: items,
    again: function () { HT.startWords(themeId); }, next: null, menu: 'wordsMenu'
  });
};

HT.startSentences = function () {
  HT.go('practice', {
    kind: 'sent', title: HT.t('sent'), starKey: 'sent', items: HT.shuffle(HT.SENTENCES).slice(0, HT.CONFIG.practice.sentencesPerRound),
    again: HT.startSentences, next: null, menu: 'home'
  });
};

// ---- 연습 화면 (자리/낱말/문장 공통) ----
// 틀린 키는 받아들이지 않고 소리만 냅니다. 그래서 칸에는 늘 맞게 친 글자만 남습니다.
HT.Views.practice = function (cfg) {
  var view = HT.$('#view'), C = HT.CONFIG.practice, ime = new HT.Hangul();
  var idx = 0, correct = 0, errors = 0, t0 = 0, busy = false, itemErr = false, timer = null;
  var items = cfg.items.map(function (it) { return Object.assign({ keys: HT.keysOf(it.text) }, it); });

  view.innerHTML = '<section class="pv pv-' + cfg.kind + '">' +
    '<div class="bar"><button type="button" class="btn small" data-back>← ' + HT.esc(HT.t('back')) + '</button><h2>' + HT.esc(cfg.title) + '</h2>' +
    '<div class="meters"><span class="meter"><small>' + HT.esc(HT.t('speed')) + '</small><b id="pv-speed">0</b></span>' +
    '<span class="meter"><small>' + HT.esc(HT.t('acc')) + '</small><b id="pv-acc">100%</b></span></div></div>' +
    '<div class="progress" aria-hidden="true"><div id="pv-prog"></div></div>' +
    '<div class="card target-card" id="pv-card"></div>' +
    '<div class="typed" id="pv-typed"></div>' +
    '<p class="hintline" id="pv-hint">&nbsp;</p>' +
    '<p class="tipbox" id="pv-tip"' + (cfg.tip ? '' : ' hidden') + '>' + (cfg.tip ? HT.tipHTML(cfg.tip) : '') + '</p>' +
    '<div id="pv-kb"></div>' +
    '<p class="note">' + HT.esc(HT.t('pressKey')) + ' · ' + HT.esc(HT.t('practiceNote')) + '</p></section>';
  var kb = HT.Keyboard(HT.$('#pv-kb'), onKey), card = HT.$('#pv-card');

  function sayItem(it) {
    if (it.jamo) HT.Speech.say(HT.JINFO[it.text][0]);
    else HT.Speech.say(it.text);
  }
  function showItem() {
    ime.reset(); itemErr = false;
    var it = items[idx], html = '';
    if (it.jamo) {
      var inf = HT.JINFO[it.text];
      html = '<div class="big-jamo">' + it.text + '</div><div class="sub">' + HT.esc(inf[0]) + ' · [' + HT.esc(inf[1]) + ']</div>';
    } else {
      if (it.emoji) html += '<div class="emoji" aria-hidden="true">' + it.emoji + '</div>';
      html += '<div class="target" id="pv-target"></div>';
      if (it.rom || it.en) html += '<div class="sub">' + (it.rom ? '<span class="rom">' + HT.esc(it.rom) + '</span>' : '') + (it.en ? '<span class="en">' + HT.esc(it.en) + '</span>' : '') + '</div>';
      if (it.review) html += '<span class="tag">🔁 ' + HT.esc(HT.t('review')) + '</span>';
    }
    html += '<button type="button" class="say" data-say aria-label="listen">🔊</button><div class="praise" id="pv-praise" hidden></div>';
    card.innerHTML = html;
    card.classList.remove('win');
    sayItem(it);
    renderState();
  }
  function renderState() {
    var it = items[idx];
    var tEl = HT.$('#pv-target');
    if (tEl) {
      var done = ime.text.length, full = HT.keysOf(ime.value).length === it.keys.length;
      tEl.innerHTML = it.text.split('').map(function (ch, i) {
        var cls = full || i < done ? 'done' : i === done ? 'cur' : '';
        return '<span class="ch ' + cls + (ch === ' ' ? ' sp' : '') + '">' + (ch === ' ' ? '·' : HT.esc(ch)) + '</span>';
      }).join('');
    }
    var comp = ime.compChar();
    HT.$('#pv-typed').innerHTML = ime.value ? HT.esc(ime.text).replace(/ /g, '&nbsp;') + (comp ? '<span class="comp">' + HT.esc(comp) + '</span>' : '') :
      '<span class="ph">' + HT.esc(HT.t('typeHere')) + '</span>';
    HT.showNextKey(kb, HT.$('#pv-hint'), busy ? null : it.keys[HT.keysOf(ime.value).length]);
    HT.$('#pv-prog').style.width = (idx / items.length * 100) + '%';
    var mins = t0 ? (performance.now() - t0) / 60000 : 0;
    HT.$('#pv-speed').textContent = mins > 0.02 ? Math.round(correct / mins) : 0;
    HT.$('#pv-acc').textContent = (correct + errors ? Math.round(correct / (correct + errors) * 100) : 100) + '%';
  }
  function onKey(k) {
    if (busy || k.type === 'esc' || k.type === 'enter') return;
    var it = items[idx];
    if (!t0) t0 = performance.now();
    if (k.type === 'bs') { ime.backspace(); HT.Sfx.tick(); renderState(); return; }
    var snap = ime.snapshot();
    if (k.type === 'jamo') ime.input(k.j);
    else if (k.type === 'space') ime.space();
    else if (k.type === 'char') ime.char(k.ch);
    var tk = HT.keysOf(ime.value);
    if (!HT.isPrefix(tk, it.keys)) {
      ime.restore(snap); errors++; itemErr = true; HT.Sfx.wrong();
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      renderState(); return;
    }
    correct++; HT.Sfx.tick();
    if (tk.length === it.keys.length) complete();
    renderState();
  }
  function complete() {
    busy = true;
    var it = items[idx];
    HT.Sfx.ok();
    card.classList.add('win');
    var pr = HT.$('#pv-praise'); var p = HT.pick(HT.PRAISE); pr.textContent = HT.L(p[0], p[1]); pr.hidden = false;
    var d = HT.Store.data();
    d.keysTyped += it.keys.length;
    if (cfg.kind === 'words') { d.wordsTyped += 1; HT.Store.markMiss(it.text, itemErr); }
    if (cfg.kind === 'sent') d.wordsTyped += it.text.split(' ').length;
    var n = idx + 1;
    if (cfg.kind !== 'keys' && n % C.tipEvery === 0 && n < items.length) {
      var tb = HT.$('#pv-tip'); tb.innerHTML = HT.tipHTML(HT.randomTip()); tb.hidden = false;
    }
    timer = setTimeout(function () {
      busy = false; idx++;
      if (idx >= items.length) finish(); else showItem();
    }, C.nextDelayMs[cfg.kind]);
  }
  function finish() {
    var secs = (performance.now() - t0) / 1000, speed = Math.round(correct / Math.max(secs / 60, 0.01));
    var acc = correct + errors ? Math.round(correct / (correct + errors) * 100) : 100;
    var stars = acc >= C.stars.three ? 3 : acc >= C.stars.two ? 2 : 1;
    var d = HT.Store.data();
    if (cfg.starKey) d.stars[cfg.starKey] = Math.max(d.stars[cfg.starKey] || 0, stars);
    if (cfg.kind !== 'keys') d.bestSpeed = Math.max(d.bestSpeed, speed);
    HT.Store.touchDay(); HT.Store.save(); HT.checkBadges();
    HT.go('result', { cfg: cfg, stars: stars, speed: speed, acc: acc, secs: secs });
  }
  view.onclick = function (e) {
    if (e.target.closest('[data-back]')) return HT.go(cfg.menu);
    if (e.target.closest('[data-say]')) sayItem(items[idx]);
  };
  HT.inputHandler = onKey;
  showItem();
  return function () { clearTimeout(timer); view.onclick = null; };
};

// ==== views-story.js ====
// 동화 긴 글 (타자 검정): 정해진 시간 동안 동화를 한 줄씩 칩니다.
// 문장부호와 따옴표는 자동으로 채워집니다(화면 자판에 없기 때문).
var HT = globalThis.HT = globalThis.HT || {};
HT.Views = HT.Views || {};

HT.isTypable = function (ch) {
  var c = ch.charCodeAt(0);
  return ch === ' ' || (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3131 && c <= 0x318E);
};

HT.Views.storyMenu = function () {
  var view = HT.$('#view'), d = HT.Store.data(), C = HT.CONFIG.story;
  var minutes = d.gameCfg.storyMin || C.defaultMinutes;
  view.innerHTML = '<div class="bar"><button type="button" class="btn small" data-back>← ' + HT.esc(HT.t('back')) + '</button><h2>' + HT.esc(HT.t('story')) + '</h2></div>' +
    '<div class="panel story-opts"><span class="lbl">' + HT.esc(HT.t('timeSel')) + '</span>' +
    HT.segmented('st-min', C.minuteChoices.map(function (m) { return [String(m), HT.t('minutes', { n: m })]; }), String(minutes)) + '</div>' +
    '<div class="cards stories">' + HT.STORIES.map(function (s) {
      var best = d.storyBest[s.id];
      return '<button type="button" class="mode-card" data-story="' + s.id + '"><span class="glyph">' + s.emoji + '</span><span class="mc-t">' +
        HT.esc(HT.L(s.ko, s.en)) + '</span><span class="mc-d">' + HT.esc(HT.lang === 'ko' ? s.en : s.ko) + '</span>' +
        (best ? '<span class="mc-best">🏅 ' + best + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  HT.bindSegmented(view, 'st-min', function (v) { d.gameCfg.storyMin = +v; minutes = +v; HT.Store.save(); });
  view.onclick = function (e) {
    if (e.target.closest('[data-back]')) return HT.go('home');
    var b = e.target.closest('[data-story]'); if (!b) return;
    HT.Sfx.click();
    HT.go('story', { id: b.dataset.story, minutes: minutes });
  };
  return function () { view.onclick = null; };
};

HT.Views.story = function (arg) {
  var view = HT.$('#view'), story = HT.STORIES.filter(function (s) { return s.id === arg.id; })[0];
  var ime = new HT.Hangul(), lineIdx = 0, ok = 0, bad = 0, t0 = 0, limit = arg.minutes * 60, timer = 0, ended = false, doneKeys = 0;
  var lines = story.lines.map(function (t) { return { text: t, keys: HT.keysOf(t) }; });
  var totalKeys = lines.reduce(function (a, l) { return a + l.keys.filter(function (k) { return HT.isTypable(k); }).length; }, 0);

  view.innerHTML = '<section class="pv pv-story">' +
    '<div class="bar"><button type="button" class="btn small" data-back>← ' + HT.esc(HT.t('back')) + '</button><h2>' + story.emoji + ' ' + HT.esc(HT.L(story.ko, story.en)) + '</h2>' +
    '<div class="meters"><span class="meter"><small>' + HT.esc(HT.t('timeLeft')) + '</small><b id="sv-time"></b></span>' +
    '<span class="meter"><small>' + HT.esc(HT.t('speed')) + '</small><b id="sv-speed">0</b></span>' +
    '<span class="meter"><small>' + HT.esc(HT.t('acc')) + '</small><b id="sv-acc">100%</b></span></div></div>' +
    '<div class="progress" aria-hidden="true"><div id="sv-prog"></div></div>' +
    '<div class="card story-card"><p class="sv-prev" id="sv-prev"></p><div class="target" id="sv-line"></div><p class="sv-next" id="sv-next"></p></div>' +
    '<div class="typed" id="sv-typed"></div><p class="hintline" id="sv-hint">&nbsp;</p><div id="sv-kb"></div>' +
    '<p class="note">' + HT.esc(HT.t('punctNote')) + '</p></section>';
  var kb = HT.Keyboard(HT.$('#sv-kb'), onKey);

  // 다음 글자가 문장부호면 자동으로 채움
  function autoFill() {
    var l = lines[lineIdx], tk = HT.keysOf(ime.value);
    while (tk.length < l.keys.length && !HT.isTypable(l.keys[tk.length])) {
      ime.char(l.keys[tk.length]);
      tk = HT.keysOf(ime.value);
    }
  }
  function lineDone() { return HT.keysOf(ime.value).length === lines[lineIdx].keys.length; }
  function showLine() {
    ime.reset(); autoFill();
    HT.$('#sv-prev').textContent = lineIdx > 0 ? lines[lineIdx - 1].text : '';
    HT.$('#sv-next').textContent = lineIdx + 1 < lines.length ? lines[lineIdx + 1].text : '';
    render();
  }
  function elapsed() { return t0 ? (performance.now() - t0) / 1000 : 0; }
  function typedKeysNow() { return doneKeys + HT.keysOf(ime.value).filter(function (k) { return HT.isTypable(k); }).length; }
  function render() {
    var l = lines[lineIdx], done = ime.text.length, full = lineDone();
    HT.$('#sv-line').innerHTML = l.text.split('').map(function (ch, i) {
      var cls = full || i < done ? 'done' : i === done ? 'cur' : '';
      if (!HT.isTypable(ch)) cls += ' punct';
      return '<span class="ch ' + cls + (ch === ' ' ? ' sp' : '') + '">' + (ch === ' ' ? '·' : HT.esc(ch)) + '</span>';
    }).join('');
    var comp = ime.compChar();
    HT.$('#sv-typed').innerHTML = ime.value ? HT.esc(ime.text).replace(/ /g, '&nbsp;') + (comp ? '<span class="comp">' + HT.esc(comp) + '</span>' : '') :
      '<span class="ph">' + HT.esc(HT.t('typeHere')) + '</span>';
    HT.showNextKey(kb, HT.$('#sv-hint'), ended ? null : l.keys[HT.keysOf(ime.value).length]);
    HT.$('#sv-prog').style.width = Math.round(typedKeysNow() / totalKeys * 100) + '%';
    tick();
  }
  function tick() {
    var left = Math.max(0, limit - elapsed());
    HT.$('#sv-time').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    var mins = elapsed() / 60;
    HT.$('#sv-speed').textContent = mins > 0.05 ? Math.round(typedKeysNow() / mins) : 0;
    HT.$('#sv-acc').textContent = (ok + bad ? Math.round(ok / (ok + bad) * 100) : 100) + '%';
    if (t0 && left <= 0 && !ended) finish(false);
  }
  function onKey(k) {
    if (ended || k.type === 'esc' || k.type === 'enter' || k.type === 'char') return;
    if (!t0) { t0 = performance.now(); timer = setInterval(tick, 250); }
    var l = lines[lineIdx];
    if (k.type === 'bs') {
      ime.backspace();
      // 지운 뒤 끝이 문장부호만 남으면 그것도 지워서 자모를 다시 칠 수 있게 함
      while (ime.value && !HT.isTypable(ime.value.slice(-1)) && ime.text.length) { ime.text = ime.text.slice(0, -1); }
      HT.Sfx.tick(); render(); return;
    }
    var snap = ime.snapshot();
    if (k.type === 'jamo') ime.input(k.j); else if (k.type === 'space') ime.space();
    var tk = HT.keysOf(ime.value);
    if (!HT.isPrefix(tk, l.keys)) { ime.restore(snap); bad++; HT.Sfx.wrong(); var el = HT.$('#sv-typed'); el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); render(); return; }
    ok++; HT.Sfx.tick();
    autoFill();
    if (lineDone()) {
      doneKeys += l.keys.filter(function (x) { return HT.isTypable(x); }).length;
      HT.Sfx.ok();
      if (lineIdx + 1 >= lines.length) { render(); finish(true); return; }
      lineIdx++; showLine(); return;
    }
    render();
  }
  function finish(complete) {
    ended = true; clearInterval(timer);
    var secs = Math.min(elapsed(), limit), kpm = Math.round(typedKeysNow() / Math.max(secs / 60, 0.01));
    var acc = ok + bad ? Math.round(ok / (ok + bad) * 100) : 100, d = HT.Store.data();
    kpm = Math.min(kpm, HT.CONFIG.race.cpuKpmMax);
    d.storyBest[story.id] = Math.max(d.storyBest[story.id] || 0, kpm);
    d.bestSpeed = Math.max(d.bestSpeed, kpm);
    d.keysTyped += ok;
    HT.Store.touchDay(); HT.Store.save(); HT.checkBadges();
    var stars = acc >= HT.CONFIG.practice.stars.three ? 3 : acc >= HT.CONFIG.practice.stars.two ? 2 : 1;
    HT.go('result', {
      title: complete ? HT.t('storyDone') : HT.t('timeUp'), stars: stars, speed: kpm, acc: acc, secs: secs,
      extra: HT.t('linesDone', { n: complete ? lines.length : lineIdx, m: lines.length }),
      cfg: { again: function () { HT.go('story', arg); }, next: null, menu: 'storyMenu' }
    });
  }
  view.onclick = function (e) { if (e.target.closest('[data-back]')) HT.go('storyMenu'); };
  HT.inputHandler = onKey;
  showLine();
  return function () { clearInterval(timer); view.onclick = null; };
};

// ==== game-falling.js ====
// 단어비(rain)와 풍선 팡팡(balloon): 움직이는 단어를 쳐서 없애는 게임. 둘은 움직이는 방향과 그림만 다릅니다.
var HT = globalThis.HT = globalThis.HT || {};
HT.Views = HT.Views || {};

HT.FONT_KO = "Jua, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif";
HT.FONT_EMOJI = "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
HT.FONT_PIXEL = "'Press Start 2P', 'Courier New', monospace";
HT.BALLOON_COLORS = ['#FF004D', '#29ADFF', '#00B543', '#FF77A8', '#FFA300', '#83769C'];

// 게임에 나올 단어 묶음
HT.gamePool = function (content) {
  if (content === 'jamo') {
    return 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅑㅓㅕㅗㅛㅜㅠㅡㅣㅐㅔ'.split('').map(function (j) { return { text: j, sub: '[' + HT.JINFO[j][1] + ']', say: HT.JINFO[j][0] }; });
  }
  if (content === 'syl') return HT.SYLLABLES.map(function (s) { return { text: s, say: s }; });
  return HT.ALL_WORDS.filter(function (w) { return w.text.indexOf(' ') < 0; })
    .map(function (w) { return { text: w.text, sub: w.en, emoji: w.emoji, say: w.text, word: true }; });
};

HT.Views.game = function (kind) {
  var view = HT.$('#view'), C = HT.CONFIG[kind], P = HT.Store.data(), ime = new HT.Hangul();
  var cfg = Object.assign({ content: 'word', speed: 'slow', hint: true }, P.gameCfg[kind] || {});
  var canvas, ctx, W = 800, H = 500, FS = 34, raf = 0, last = 0, stars = [], clouds = [];
  var G = null, hudCache = '', hintCache = null, typedCache = null;

  view.innerHTML = '<section class="gv gv-' + kind + '">' +
    '<div class="bar"><button type="button" class="btn small" data-back>← ' + HT.esc(HT.t('back')) + '</button><h2>' + HT.esc(HT.t(kind)) + '</h2>' +
    '<div class="hud" id="gv-hud"></div><button type="button" class="btn small" id="gv-pause" aria-label="pause">❚❚</button></div>' +
    '<div class="screen" id="gv-frame"><canvas id="gv-canvas"></canvas>' +
    '<div class="overlay" id="ov-start"></div><div class="overlay" id="ov-pause" hidden></div><div class="overlay" id="ov-over" hidden></div>' +
    '<div class="debug-hud" id="gv-debug" hidden></div></div>' +
    '<div class="gin"><div class="typed game" id="gv-typed"></div>' +
    '<button type="button" class="btn small toggle" id="gv-hint" aria-pressed="' + cfg.hint + '">💡 ' + HT.esc(HT.t('hint')) + '</button></div>' +
    '<p class="hintline" id="gv-hintline">&nbsp;</p><div id="gv-kb"></div></section>';
  canvas = HT.$('#gv-canvas'); ctx = canvas.getContext('2d');
  var kb = HT.Keyboard(HT.$('#gv-kb'), onKey, { enter: true });

  function newState() {
    return { state: 'menu', ents: [], parts: [], floats: [], score: 0, level: 1, hearts: C.lives, combo: 0, maxCombo: 0,
      pops: 0, caught: [], spawnT: 0.4, slowT: 0, t: 0, shake: 0, banner: null, keysOk: 0, keysBad: 0, god: false };
  }
  G = newState();

  // ---- 크기 ----
  function resize() {
    var cssW = HT.$('#gv-frame').clientWidth || 800, narrow = cssW < 600;
    W = narrow ? 480 : 800; FS = narrow ? 30 : 34;
    var cssH = narrow ? Math.min(cssW * 1.0, innerHeight * 0.46) : Math.min(cssW * 0.56, innerHeight * 0.56);
    cssH = Math.max(cssH, 230);
    H = Math.round(W * cssH / cssW);
    canvas.style.height = cssH + 'px';
    var dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.width / W, 0, 0);
    stars = []; for (var i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.8, r: Math.random() < 0.2 ? 3 : 2, sp: HT.rand(0.5, 2), ph: Math.random() * 6 });
    clouds = []; for (var c = 0; c < 4; c++) clouds.push({ x: Math.random() * W, y: HT.rand(20, H * 0.6), s: HT.rand(0.7, 1.3), v: HT.rand(6, 14) });
    G.ents.forEach(function (e) { e.x = HT.clamp(e.x, 10, W - 10); });
  }

  // ---- 난이도 계산 (모두 CONFIG 값에서 나옴) ----
  function speedMul() { return Math.min(C.maxSpeedMul, 1 + (G.level - 1) * C.speedUpPerLevel); }
  function travelSeconds() { return (kind === 'rain' ? C.fallSeconds : C.riseSeconds)[cfg.speed] / speedMul(); }
  function spawnEvery() { return Math.max(C.minSpawnSeconds, C.spawnSeconds[cfg.speed] / speedMul()); }
  function maxOnScreen() { return Math.min(C.onScreen.max, C.onScreen.base + (G.level - 1) * C.onScreen.perLevel); }
  HT._gameDebug = function () { return { level: G.level, speedMul: speedMul(), travel: travelSeconds(), spawnEvery: spawnEvery(), max: maxOnScreen(), ents: G.ents.length }; };

  function textW(e) {
    ctx.font = FS + 'px ' + HT.FONT_KO;
    return ctx.measureText(e.text).width;
  }
  function conflicts(keys) {
    return G.ents.some(function (e) { return HT.isPrefix(keys, e.keys) || HT.isPrefix(e.keys, keys); });
  }
  function spawn() {
    var pool = HT.gamePool(cfg.content), item = null, missedWords = Object.keys(P.missed);
    for (var tries = 0; tries < 12 && !item; tries++) {
      var cand = (cfg.content === 'word' && missedWords.length && Math.random() < 0.25)
        ? pool.filter(function (p) { return p.text === HT.pick(missedWords); })[0] : HT.pick(pool);
      if (cand && !conflicts(HT.keysOf(cand.text))) item = cand;
    }
    if (!item) return;
    var e = Object.assign({ keys: HT.keysOf(item.text), gold: Math.random() < C.goldChance, t: 0 }, item);
    var w = textW(e);
    var v = 0;
    if (kind === 'rain') {
      e.w = w; e.x = HT.rand(16 + w / 2, W - 16 - w / 2); e.y = -FS * 0.6;
      v = (H - 34) / travelSeconds();
    } else {
      e.r = Math.max(e.emoji ? FS * 1.5 : FS * 1.2, w / 2 + 16);
      e.x = HT.rand(e.r + 12, W - e.r - 12); e.y = H + e.r * 1.2;
      e.ph = Math.random() * 6; e.amp = HT.rand(8, 18); e.wf = HT.rand(0.8, 1.6);
      e.color = e.gold ? '#FFEC27' : HT.pick(HT.BALLOON_COLORS);
      v = (H + e.r * 3.4) / travelSeconds();
    }
    e.v = v * HT.rand(0.9, 1.1);
    G.ents.push(e);
  }

  // ---- 진행 ----
  function update(dt) {
    G.t += dt;
    var slow = G.slowT > 0 ? C.slowFactor || 1 : 1;
    if (G.slowT > 0) G.slowT -= dt;
    for (var i = G.ents.length - 1; i >= 0; i--) {
      var e = G.ents[i];
      e.t += dt;
      if (kind === 'rain') {
        e.y += e.v * dt * slow;
        if (e.y + FS * 0.5 >= H - 34) miss(e, i);
      } else {
        e.y -= e.v * dt * slow;
        e.cx = e.x + Math.sin(e.t * e.wf + e.ph) * e.amp;
        if (e.y + e.r * 1.15 < 0) miss(e, i);
      }
      if (G.state !== 'play') return; // 마지막 하트를 잃으면 즉시 멈춤
    }
    G.spawnT -= dt;
    if ((G.spawnT <= 0 || G.ents.length === 0) && G.ents.length < maxOnScreen()) { spawn(); G.spawnT = spawnEvery(); }
    G.parts = G.parts.filter(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; return p.life > 0; });
    G.floats = G.floats.filter(function (f) { f.y -= 28 * dt; f.life -= dt; return f.life > 0; });
    if (G.shake > 0) G.shake -= dt;
    if (G.banner) { G.banner.life -= dt; if (G.banner.life <= 0) G.banner = null; }
    clouds.forEach(function (c) { c.x += c.v * dt; if (c.x > W + 80) c.x = -120; });
  }

  function miss(e, i) {
    G.ents.splice(i, 1);
    if (e.word) HT.Store.markMiss(e.text, true);
    G.combo = 0;
    G.floats.push({ x: kind === 'rain' ? e.x : e.cx || e.x, y: kind === 'rain' ? H - 60 : 40, text: HT.t('missed') + ' ' + e.text, color: '#FF004D', life: 1.6, max: 1.6 });
    G.shake = 0.3;
    if (!G.god) G.hearts--;
    HT.Sfx.miss();
    validateBuffer();
    if (G.hearts <= 0) gameOver();
  }

  function popEnt(e) {
    var idx = G.ents.indexOf(e); if (idx < 0) return;
    G.ents.splice(idx, 1);
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.pops++;
    var S = HT.CONFIG.score, mul = Math.min(S.comboMaxMul, 1 + (G.combo - 1) * S.comboStep);
    var pts = Math.round(e.keys.length * S.perKey * mul * (e.gold ? 2 : 1));
    G.score += pts;
    var x = kind === 'rain' ? e.x : e.cx, y = e.y;
    var cols = kind === 'rain' ? ['#29ADFF', '#FFF1E8', '#FFEC27'] : [e.color, '#FFF1E8', '#1D2B53'];
    for (var i = 0; i < 16; i++) {
      var a = Math.random() * Math.PI * 2, sp = HT.rand(80, 260);
      G.parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: HT.rand(0.4, 0.8), c: HT.pick(cols), s: HT.rand(3, 7) });
    }
    G.floats.push({ x: x, y: y - FS, text: (e.emoji ? e.emoji + ' ' : '') + (e.sub || e.text) + '  +' + pts, color: '#FFEC27', life: 1.3, max: 1.3 });
    if (e.word) HT.Store.markMiss(e.text, false);
    if (G.caught.indexOf(e.text) < 0) G.caught.push(e.text);
    HT.Sfx.pop();
    if (e.gold) {
      if (kind === 'rain') { G.slowT = C.slowSeconds; G.banner = { text: HT.t('slowTime'), life: 1.4 }; }
      else if (G.hearts < C.maxLives) { G.hearts++; G.banner = { text: HT.t('bonusHeart'), life: 1.4 }; }
      HT.Sfx.star();
    } else if (e.say) {
      HT.Speech.say(e.say);
    }
    if (G.pops % C.levelEvery === 0) {
      G.level++;
      G.banner = { text: HT.t('levelUp', { n: G.level }), life: 1.6 };
      HT.Sfx.level();
    }
  }

  function validateBuffer() {
    if (!ime.value) return;
    var tk = HT.keysOf(ime.value);
    if (!G.ents.some(function (e) { return HT.isPrefix(tk, e.keys); })) ime.reset();
  }

  // ---- 입력 ----
  function onKey(k) {
    if (k.type === 'esc') { if (G.state === 'play') pause(); else if (G.state === 'pause') resume(); return; }
    if (G.state !== 'play') { if (k.type === 'enter' && (G.state === 'menu' || G.state === 'over')) start(); return; }
    if (k.type === 'bs') { ime.backspace(); HT.Sfx.tick(); return; }
    if (k.type === 'enter' || k.type === 'space') { ime.reset(); return; }
    var snap = ime.snapshot();
    if (k.type === 'jamo') ime.input(k.j); else if (k.type === 'char') ime.char(k.ch);
    var tk = HT.keysOf(ime.value);
    var cands = G.ents.filter(function (e) { return HT.isPrefix(tk, e.keys); });
    if (!cands.length) {
      ime.restore(snap); G.combo = 0; G.keysBad++; HT.Sfx.wrong();
      var el = HT.$('#gv-typed'); el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
      return;
    }
    G.keysOk++; HT.Sfx.tick();
    var exact = cands.filter(function (e) { return e.keys.length === tk.length; })[0];
    if (exact) { popEnt(exact); ime.reset(); }
  }

  // ---- 그리기 ----
  function draw() {
    ctx.save();
    if (G.shake > 0) ctx.translate(HT.rand(-6, 6) * G.shake / 0.3, HT.rand(-6, 6) * G.shake / 0.3);
    drawBg();
    var tk = ime.value ? HT.keysOf(ime.value) : null;
    G.ents.forEach(function (e) {
      var match = tk && HT.isPrefix(tk, e.keys);
      if (kind === 'rain') drawWord(e, match); else drawBalloon(e, match);
    });
    G.parts.forEach(function (p) { ctx.globalAlpha = Math.max(0, p.life * 1.6); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    G.floats.forEach(function (f) {
      ctx.globalAlpha = Math.min(1, f.life / f.max * 1.5);
      ctx.font = Math.round(FS * 0.6) + 'px ' + HT.FONT_KO;
      ctx.lineWidth = 5; ctx.strokeStyle = '#1D2B53'; ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
    if (G.banner) {
      ctx.font = Math.round(FS * 0.75) + 'px ' + HT.FONT_PIXEL + ', ' + HT.FONT_KO;
      ctx.lineWidth = 8; ctx.strokeStyle = '#1D2B53'; ctx.strokeText(G.banner.text, W / 2, H * 0.42);
      ctx.fillStyle = '#FFEC27'; ctx.fillText(G.banner.text, W / 2, H * 0.42);
    }
    if (G.slowT > 0) { ctx.fillStyle = 'rgba(41,173,255,0.12)'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }
  function drawBg() {
    var g;
    if (kind === 'rain') {
      g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0B1230'); g.addColorStop(1, '#3A1D4A');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      stars.forEach(function (s) { ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(G.t * s.sp + s.ph)); ctx.fillStyle = '#FFF1E8'; ctx.fillRect(s.x, s.y, s.r, s.r); });
      ctx.globalAlpha = 1;
      var gy = H - 34;
      ctx.fillStyle = '#7E2553'; ctx.fillRect(0, gy, W, 34);
      ctx.fillStyle = '#AB5236';
      for (var row = 0, y = gy + 6; y < H; y += 12, row++) for (var x = row % 2 ? -12 : 0; x < W; x += 24) ctx.fillRect(x + 1, y, 22, 10);
      ctx.fillStyle = '#00E436'; ctx.fillRect(0, gy, W, 5);
    } else {
      g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#29ADFF'); g.addColorStop(1, '#C2E9FF');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      clouds.forEach(function (c) {
        var s = 12 * c.s;
        ctx.fillRect(c.x, c.y, s * 8, s * 2); ctx.fillRect(c.x + s * 2, c.y - s, s * 4, s); ctx.fillRect(c.x + s, c.y + s * 2, s * 6, s * 0.8);
      });
      ctx.fillStyle = '#00B543'; ctx.fillRect(0, H - 16, W, 16);
      ctx.fillStyle = '#008751'; for (var gx = 0; gx < W; gx += 16) ctx.fillRect(gx, H - 16, 8, 6);
    }
  }
  function drawText(e, x, y, match) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = FS + 'px ' + HT.FONT_KO;
    ctx.lineWidth = 7; ctx.strokeStyle = '#1D2B53'; ctx.strokeText(e.text, x, y);
    ctx.fillStyle = match ? '#FFEC27' : (e.gold && kind === 'rain') ? '#FFA300' : '#FFFFFF';
    ctx.fillText(e.text, x, y);
  }
  function drawWord(e, match) {
    if (match) { ctx.fillStyle = 'rgba(255,236,39,0.18)'; ctx.fillRect(e.x - e.w / 2 - 10, e.y - FS * 0.7, e.w + 20, FS * 1.4); }
    if (e.emoji) { ctx.font = Math.round(FS * 0.85) + 'px ' + HT.FONT_EMOJI; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.emoji, e.x, e.y - FS * 1.0); }
    if (e.gold) { ctx.font = Math.round(FS * 0.6) + 'px ' + HT.FONT_KO; ctx.fillStyle = '#FFEC27'; ctx.fillText('★', e.x - e.w / 2 - 14, e.y); }
    drawText(e, e.x, e.y, match);
    if (e.sub) { ctx.font = Math.round(FS * 0.42) + 'px ' + HT.FONT_KO; ctx.fillStyle = '#9FD8FF'; ctx.fillText(e.sub, e.x, e.y + FS * 0.78); }
  }
  function drawBalloon(e, match) {
    var x = e.cx == null ? e.x : e.cx, y = e.y, r = e.r, ry = r * 1.15;
    ctx.strokeStyle = 'rgba(29,43,83,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y + ry + 6); ctx.quadraticCurveTo(x + 10, y + ry + r * 0.6, x - 4, y + ry + r * 1.1); ctx.stroke();
    if (match) { ctx.strokeStyle = '#FFEC27'; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(x, y, r + 7, ry + 7, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = e.color; ctx.beginPath(); ctx.ellipse(x, y, r, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#1D2B53'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 7, y + ry + 8); ctx.lineTo(x + 7, y + ry + 8); ctx.lineTo(x, y + ry - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x - r * 0.55, y - ry * 0.55, r * 0.18, ry * 0.32);
    var ty = y;
    if (e.emoji) { ctx.font = Math.round(FS * 0.75) + 'px ' + HT.FONT_EMOJI; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.emoji, x, y - ry * 0.45); ty = y + ry * 0.28; }
    drawText(e, x, ty, match);
    if (e.sub) {
      ctx.font = Math.round(FS * 0.42) + 'px ' + HT.FONT_KO; ctx.lineWidth = 4; ctx.strokeStyle = '#FFFFFF';
      ctx.strokeText(e.sub, x, y + ry + 22); ctx.fillStyle = '#1D2B53'; ctx.fillText(e.sub, x, y + ry + 22);
    }
  }

  // ---- 화면 표시 ----
  function hud() {
    var s = '<span class="hud-i"><small>' + HT.esc(HT.t('score')) + '</small><b>' + G.score + '</b></span>' +
      '<span class="hud-i"><small>' + HT.esc(HT.t('level')) + '</small><b>' + G.level + '</b></span>' +
      '<span class="hud-i"><small>' + HT.esc(HT.t('combo')) + '</small><b>' + G.combo + '</b></span>' +
      '<span class="hearts" aria-label="' + G.hearts + ' hearts">' + '♥'.repeat(Math.max(0, G.hearts)) + '<span class="lost">' + '♥'.repeat(Math.max(0, C.lives - G.hearts)) + '</span></span>';
    if (s !== hudCache) { HT.$('#gv-hud').innerHTML = s; hudCache = s; }
    var v = ime.value, comp = ime.compChar(), typed = v ? HT.esc(ime.text) + (comp ? '<span class="comp">' + HT.esc(comp) + '</span>' : '') : '<span class="ph">' + HT.esc(HT.t('typeHere')) + '</span>';
    if (typed !== typedCache) { HT.$('#gv-typed').innerHTML = typed; typedCache = typed; }
    var nextKey = null;
    if (cfg.hint && G.state === 'play' && G.ents.length) {
      var tk = HT.keysOf(v), target = null;
      if (v) target = G.ents.filter(function (e) { return HT.isPrefix(tk, e.keys); })[0];
      if (!target) target = G.ents.slice().sort(function (a, b) { return kind === 'rain' ? b.y - a.y : a.y - b.y; })[0];
      nextKey = target.keys[tk.length] || null;
    }
    if (nextKey !== hintCache) { HT.showNextKey(kb, HT.$('#gv-hintline'), nextKey); hintCache = nextKey; }
    if (HT.debugOn) {
      var dbg = HT.$('#gv-debug'); dbg.hidden = false;
      var d = HT._gameDebug();
      dbg.textContent = 'LV ' + d.level + ' · x' + d.speedMul.toFixed(2) + ' · travel ' + d.travel.toFixed(1) + 's · spawn ' + d.spawnEvery.toFixed(2) + 's · ' + d.ents + '/' + d.max + (G.god ? ' · GOD' : '');
    }
  }
  function loop(ts) {
    raf = requestAnimationFrame(loop);
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
    if (G.state === 'play') update(dt);
    else G.t += dt;
    draw(); hud();
  }

  // ---- 시작/멈춤/끝 ----
  function startMenu() {
    var ov = HT.$('#ov-start');
    ov.innerHTML = '<div class="ov-box"><h3>' + HT.esc(HT.t(kind)) + '</h3><p>' + HT.esc(HT.t(kind + 'Desc')) + '</p>' +
      '<p class="lbl">' + HT.esc(HT.t('content')) + '</p>' + HT.segmented('sg-content', [['jamo', HT.t('cJamo')], ['syl', HT.t('cSyl')], ['word', HT.t('cWord')]], cfg.content) +
      '<p class="lbl">' + HT.esc(HT.t('speedSel')) + '</p>' + HT.segmented('sg-speed', [['slow', HT.t('slow')], ['normal', HT.t('normal')], ['fast', HT.t('fast')]], cfg.speed) +
      '<p class="best">🏆 ' + HT.esc(HT.t('bestLbl')) + ' ' + (P.best[kind] || 0) + '</p>' +
      '<button type="button" class="btn primary big" id="gv-start">' + HT.esc(HT.t('start')) + '</button></div>';
    HT.bindSegmented(ov, 'sg-content', function (v) { cfg.content = v; saveCfg(); });
    HT.bindSegmented(ov, 'sg-speed', function (v) { cfg.speed = v; saveCfg(); });
    HT.$('#gv-start').onclick = start;
  }
  function saveCfg() { P.gameCfg[kind] = cfg; HT.Store.save(); }
  function start() {
    HT.Sfx.ensure(); HT.Sfx.click();
    G = newState(); G.state = 'play'; ime.reset();
    ['#ov-start', '#ov-pause', '#ov-over'].forEach(function (s) { HT.$(s).hidden = true; });
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function pause() {
    if (G.state !== 'play') return;
    G.state = 'pause';
    var ov = HT.$('#ov-pause');
    ov.innerHTML = '<div class="ov-box"><h3>' + HT.esc(HT.t('paused')) + '</h3><p class="tipbox">' + HT.tipHTML(HT.randomTip()) + '</p>' +
      '<button type="button" class="btn primary big" id="gv-resume">' + HT.esc(HT.t('resume')) + '</button></div>';
    ov.hidden = false;
    HT.$('#gv-resume').onclick = resume;
  }
  function resume() { if (G.state !== 'pause') return; G.state = 'play'; HT.$('#ov-pause').hidden = true; last = 0; }

// ==== game-race.js ====
// 타자 레이스: 4레인 (나 + 컴퓨터 3명). 맞게 친 타 수만큼 앞으로 달립니다.
// 컴퓨터 속도는 아이의 최근 평균 타수에 맞춰 정해집니다(CONFIG.race.cpuRatios).
var HT = globalThis.HT = globalThis.HT || {};
HT.Views = HT.Views || {};

HT.Views.race = function () {
  var view = HT.$('#view'), C = HT.CONFIG.race, P = HT.Store.data(), prof = HT.Store.profile(), ime = new HT.Hangul();
  var cfg = Object.assign({ content: 'word', diff: 'normal', dist: 'normal', hint: true }, P.gameCfg.race || {});

  var R = null, hintCache, typedCache, hudCache;

  view.innerHTML = '<section class="gv gv-race">' +
    '<div class="bar"><button type="button" class="btn small" data-back>← ' + HT.esc(HT.t('back')) + '</button><h2>' + HT.esc(HT.t('race')) + '</h2>' +
    '<div class="hud" id="rc-hud"></div></div>' +
    '<div class="screen" id="rc-frame"><canvas id="rc-canvas"></canvas>' +
    '<div class="overlay" id="rc-setup"></div><div class="overlay" id="rc-over" hidden></div>' +
    '<div class="debug-hud" id="rc-debug" hidden></div></div>' +
    '<div class="race-target" id="rc-target"></div>' +
    '<div class="gin"><div class="typed game" id="rc-typed"></div>' +
    '<button type="button" class="btn small toggle" id="rc-hint" aria-pressed="' + cfg.hint + '">💡 ' + HT.esc(HT.t('hint')) + '</button></div>' +
    '<p class="hintline" id="rc-hintline">&nbsp;</p><div id="rc-kb"></div></section>';

  // ---- 상대 선수 속도 정하기 ----
  function rivalKpms() {

  function newRace() {

  function resize() {

  // ---- 진행 ----

  // ---- 그리기 ----
  function draw() {
    var x0 = W < 600 ? 92 : 130, x1 = W - 36, top = 26, laneH = (H - top - 14) / R.racers.length;
    ctx.fillStyle = '#00B543'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#008751'; for (var gx = 0; gx < W; gx += 20) ctx.fillRect(gx, 0, 10, 8);

    for (var f = 0; f < W; f += 28) { ctx.fillStyle = flagCols[(f / 28) % 4]; ctx.beginPath(); ctx.moveTo(f, 10); ctx.lineTo(f + 22, 10); ctx.lineTo(f + 11, 22); ctx.fill(); }

      ctx.fillStyle = r.me ? '#C75B3A' : '#AB5236'; ctx.fillRect(0, y, W, laneH - 2);
      ctx.fillStyle = 'rgba(255,241,232,0.8)'; ctx.fillRect(0, y + laneH - 3, W, 2);
      // 이름표

      ctx.font = Math.round(laneH * 0.3) + 'px ' + HT.FONT_KO;
      ctx.fillStyle = r.me ? '#FFEC27' : '#FFF1E8';
      ctx.fillText((r.me ? '★ ' : '') + r.name, 8, y + laneH * 0.36);
      ctx.font = Math.round(laneH * 0.2) + 'px ' + HT.FONT_KO;
      ctx.fillStyle = 'rgba(255,241,232,0.85)';
      var kpmTxt = r.me ? (liveKpm() + ' ' + HT.t('speedUnit')) : (r.kpm + ' ' + HT.t('speedUnit'));
      ctx.fillText(kpmTxt, 8, y + laneH * 0.72);
    });
    // 출발선, 결승선
    ctx.fillStyle = '#FFF1E8'; ctx.fillRect(x0 - 2, top, 3, H - top - 14);
    for (var cy = top, n = 0; cy < H - 14; cy += 8, n++) {
      ctx.fillStyle = n % 2 ? '#1D2B53' : '#FFFFFF'; ctx.fillRect(x1, cy, 8, 8);
      ctx.fillStyle = n % 2 ? '#FFFFFF' : '#1D2B53'; ctx.fillRect(x1 + 8, cy, 8, 8);

  function placeOf(r) {

  // ---- 글자 표시 ----

      '<span class="hud-i"><small>%</small><b>' + pct + '</b></span>' +
      (place ? '<span class="hud-i"><small>' + HT.esc(HT.L('순위', 'Place')) + '</small><b>' + place + '</b></span>' : '');

  }
  function loop(ts) {

  // ---- 설정/시작/끝 ----
  function setup() {
    var ov = HT.$('#rc-setup');

      '<p class="lbl">' + HT.esc(HT.t('content')) + '</p>' + HT.segmented('rs-content', [['word', HT.t('cWord')], ['sent', HT.t('cSent')]], cfg.content) +
      '<p class="lbl">' + HT.esc(HT.t('diffSel')) + '</p>' + HT.segmented('rs-diff', [['easy', HT.t('easy')], ['normal', HT.t('normal')], ['hard', HT.t('hard')]], cfg.diff) +
      '<p class="lbl">' + HT.esc(HT.t('lengthSel')) + '</p>' + HT.segmented('rs-dist', [['short', HT.t('short')], ['normal', HT.t('normal')], ['long', HT.t('long')]], cfg.dist) +

      '<button type="button" class="btn primary big" id="rc-start">' + HT.esc(HT.t('start')) + '</button></div>';

        return '<li' + (r.me ? ' class="me"' : '') + '><span>' + r.emoji + ' ' + HT.esc(r.name) + '</span><small>' + (r.me ? kpm : r.kpm) + ' ' + HT.esc(HT.t('speedUnit')) + '</small></li>';
      }).join('') + '</ol>' +
      '<div class="statbar"><div class="stat"><small>' + HT.esc(HT.t('yourSpeed')) + '</small><b>' + kpm + '</b></div>' +
      '<div class="stat"><small>' + HT.esc(HT.t('acc')) + '</small><b>' + acc + '%</b></div></div>' +
      '<p class="tipbox">' + HT.tipHTML(HT.randomTip()) + '</p>' +
      '<div class="actions"><button type="button" class="btn primary" id="rc-again">' + HT.esc(HT.t('retry')) + '</button>' +
      '<button type="button" class="btn" id="rc-setup-b">' + HT.esc(HT.t('content')) + '</button></div></div>';
    ov.hidden = false;
    HT.$('#rc-again').onclick = start;
    HT.$('#rc-setup-b').onclick = function () { ov.hidden = true; R = newRace(); renderTarget(); setup(); };
    HT.checkBadges();
  }

  HT._gameCtl = {
    levelUp: function () { /* 레이스에는 레벨 없음 */ },
    heart: function () {},
    god: function () { R.me.prog = Math.min(1, R.me.prog + 0.1); R.doneKeys = Math.round(R.course.total * R.me.prog); },
    end: function () { if (R.state === 'run') { R.doneKeys = R.course.total; ime.reset(); } }
  };

  view.onclick = function (e) {
    if (e.target.closest('[data-back]')) return HT.go('home');
    var hb = e.target.closest('#rc-hint');
    if (hb) { cfg.hint = !cfg.hint; hb.setAttribute('aria-pressed', String(cfg.hint)); hintCache = undefined; saveCfg(); }
  };
  addEventListener('resize', resize);
  resize(); setup(); renderTarget();
  HT.inputHandler = onKey;
  raf = requestAnimationFrame(loop);
  return function () { cancelAnimationFrame(raf); removeEventListener('resize', resize); view.onclick = null; HT._gameCtl = null; HT._raceDebug = null; };
};

// ==== app.js ====
// 화면 이동, 위쪽 막대(언어/소리), 디버그 패널, 시작
var HT = globalThis.HT = globalThis.HT || {};

HT.route = null;
HT._cleanup = null;
HT.go = function (name, arg) {
  if (HT._cleanup) { try { HT._cleanup(); } catch (e) { console.error(e); } }
  HT._cleanup = null; HT.inputHandler = null; HT.activeKeyboard = null;
  if (!HT.Store.profile() && name !== 'profiles') name = 'profiles';
  HT.route = { name: name, arg: arg };
  var view = HT.$('#view');
  view.className = 'view v-' + name;
  window.scrollTo(0, 0);
  HT._cleanup = HT.Views[name](arg) || null;
  HT.renderHeader();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
};

HT.renderHeader = function () {
  var s = HT.Store.settings(), p = HT.Store.profile();
  HT.$('#top-actions').innerHTML =
    (p ? '<button type="button" class="btn small who" id="hd-who" title="' + HT.esc(HT.t('change')) + '">' + p.avatar + ' ' + HT.esc(p.name) + '</button>' : '') +
    '<button type="button" class="btn small" id="hd-lang">' + HT.esc(HT.t('langToggle')) + '</button>' +
    '<button type="button" class="btn small toggle" id="hd-sfx" aria-pressed="' + (s.sound !== false) + '" title="' + HT.esc(HT.t('soundFx')) + '">' + (s.sound !== false ? '🔊' : '🔇') + '</button>' +
    '<button type="button" class="btn small toggle" id="hd-say" aria-pressed="' + (s.speech !== false) + '" title="' + HT.esc(HT.t('readAloud')) + '">🗣️</button>';
  HT.$('#app-title').textContent = HT.t('appName');
  document.documentElement.lang = HT.lang;
};

HT.applySettings = function () {
  var s = HT.Store.settings();
  HT.lang = s.lang || ((navigator.language || 'ko').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en');
  HT.Sfx.on = s.sound !== false;
  HT.Speech.on = s.speech !== false;
};

// ---- 디버그 패널: 주소 끝 #debug 또는 로고 5번 누르기 ----
HT.debugOn = false;
HT.openDebug = function () {
  HT.debugOn = true;
  var el = HT.$('#debug-panel');
  el.hidden = false;
  el.innerHTML = '<div class="dbg-head"><b>🛠 ' + HT.esc(HT.t('debug')) + '</b><button type="button" class="btn small" id="dbg-close">✕</button></div>' +
    '<div class="dbg-row"><button type="button" class="btn small" data-dbg="levelUp">LV +1</button><button type="button" class="btn small" data-dbg="heart">♥ +1</button>' +
    '<button type="button" class="btn small" data-dbg="god">GOD / +10%</button><button type="button" class="btn small" data-dbg="end">END</button></div>' +
    '<label for="dbg-cfg">CONFIG (JSON) — 바꾼 값만 저장돼요 / only changed values are saved</label>' +
    '<textarea id="dbg-cfg" spellcheck="false"></textarea>' +
    '<div class="dbg-row"><button type="button" class="btn small primary" id="dbg-save">저장 Save</button><button type="button" class="btn small" id="dbg-reset">기본값 Reset</button>' +
    '<button type="button" class="btn small danger" id="dbg-wipe">기록 전체 삭제 Wipe data</button></div><p class="dbg-msg" id="dbg-msg"></p>';
  HT.$('#dbg-cfg').value = JSON.stringify(HT.CONFIG, null, 2);
  el.onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var msg = HT.$('#dbg-msg');
    if (b.id === 'dbg-close') { el.hidden = true; HT.debugOn = false; document.querySelectorAll('.debug-hud').forEach(function (d) { d.hidden = true; }); return; }
    if (b.dataset.dbg) { if (HT._gameCtl) HT._gameCtl[b.dataset.dbg](); else msg.textContent = '게임 화면에서 쓰세요 / open a game first'; return; }
    if (b.id === 'dbg-save') {
      try {
        var next = JSON.parse(HT.$('#dbg-cfg').value);
        var diff = HT.configDiff(HT.DEFAULT_CONFIG, next);
        localStorage.setItem(HT.CONFIG_KEY, JSON.stringify(diff));
        HT.loadConfig();
        msg.textContent = '저장됨. 다음 판부터 적용 / Saved. Applies from the next round.';
      } catch (err) { msg.textContent = 'JSON 오류 / JSON error: ' + err.message; }
    }
    if (b.id === 'dbg-reset') {
      try { localStorage.removeItem(HT.CONFIG_KEY); } catch (e2) { /* 무시 */ }
      HT.loadConfig(); HT.$('#dbg-cfg').value = JSON.stringify(HT.CONFIG, null, 2); msg.textContent = '기본값으로 되돌림 / Reset to defaults';
    }
    if (b.id === 'dbg-wipe') {
      if (b.dataset.armed) { try { localStorage.removeItem(HT.Store.KEY); } catch (e3) { /* 무시 */ } HT.Store.load(); HT.go('profiles'); msg.textContent = 'wiped'; }
      else { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 삭제 / Tap again'; }
    }
  };
};
HT.configDiff = function (base, next) {
  var out = {};
  Object.keys(next).forEach(function (k) {
    if (!(k in base)) return;
    var b = base[k], n = next[k];
    if (b && typeof b === 'object' && !Array.isArray(b) && n && typeof n === 'object') {
      var sub = HT.configDiff(b, n);
      if (Object.keys(sub).length) out[k] = sub;
    } else if (JSON.stringify(b) !== JSON.stringify(n)) out[k] = n;
  });
  return out;
};

HT.boot = function () {
  HT.Store.load();
  HT.applySettings();
  HT.Speech.init();
  var logoTaps = 0, logoT = 0;
  HT.$('#app-title').addEventListener('click', function () {
    var now = Date.now();
    logoTaps = now - logoT < 600 ? logoTaps + 1 : 1; logoT = now;
    if (logoTaps >= 5) { logoTaps = 0; HT.openDebug(); return; }
    if (HT.route && HT.route.name !== 'home' && HT.Store.profile()) HT.go('home');
  });
  HT.$('#top-actions').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var s = HT.Store.settings();
    if (b.id === 'hd-who') { HT.Sfx.click(); HT.go('profiles'); return; }
    if (b.id === 'hd-lang') {
      s.lang = HT.lang === 'ko' ? 'en' : 'ko'; HT.Store.save(); HT.applySettings();
      // 게임/연습 도중이면 진행을 지키기 위해 막대만 바꾸고, 목록 화면은 다시 그림
      var live = ['practice', 'rain', 'balloon', 'race', 'story'].indexOf(HT.route.name) >= 0;
      if (live) HT.renderHeader(); else HT.go(HT.route.name, HT.route.arg);
    }
    if (b.id === 'hd-sfx') { s.sound = s.sound === false; HT.Store.save(); HT.applySettings(); HT.renderHeader(); HT.Sfx.click(); }
    if (b.id === 'hd-say') { s.speech = s.speech === false; HT.Store.save(); HT.applySettings(); HT.renderHeader(); }
  });
  if (location.hash === '#debug') HT.openDebug();
  HT.go(HT.Store.profile() ? 'home' : 'profiles');
};

if (typeof document !== 'undefined' && document.getElementById('view')) HT.boot();

</script>
